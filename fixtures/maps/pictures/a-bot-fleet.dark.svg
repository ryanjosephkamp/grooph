<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="map" viewBox="0 0 400 1333.5" width="400" height="1333.5" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A bot fleet: two Bots, a dot and their person</title><rect x="0" y="0" width="400" height="1333.5" style="fill:#111514"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#ebefed">A bot fleet: two Bots, a dot and their</text><text x="12" y="56" font-size="17" font-weight="700" style="fill:#ebefed">person</text><text x="12" y="73" font-size="11" style="fill:#99a19e">as of 2026-10-05 · 2 lanes · 4 sessions · 1 person · 10 handoffs,</text><text x="12" y="86" font-size="11" style="fill:#99a19e">2 waiting on a person</text><g data-people=""><rect x="12" y="98" width="376" height="106.5" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="118" font-size="12.5" font-weight="700" style="fill:#ebefed">Person</text></g><g data-lane="bots-computer"><rect x="12" y="214.5" width="376" height="254" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="234.5" font-size="12.5" font-weight="700" style="fill:#ebefed">The Bots' cloud computer</text><rect x="257.9" y="223.7" width="40.1" height="14.7" rx="7.4" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="278" y="234" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">cloud</text><text x="22" y="248" font-size="10.5" style="fill:#99a19e">one cloud computer, shared by every Bot of this</text><text x="22" y="261.5" font-size="10.5" style="fill:#99a19e">account · the person's Cursor account</text></g><g data-lane="dot-computer"><rect x="12" y="478.5" width="376" height="267.5" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="498.5" font-size="12.5" font-weight="700" style="fill:#ebefed">The dot's cloud computer</text><rect x="257.9" y="487.7" width="40.1" height="14.7" rx="7.4" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="278" y="498" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">cloud</text><text x="22" y="512" font-size="10.5" style="fill:#99a19e">the dot's own cloud computer · the person's</text><text x="22" y="525.5" font-size="10.5" style="fill:#99a19e">ChatGPT account</text></g><g data-person="person"><rect data-card="" x="20" y="127.5" width="278" height="69" rx="14" stroke-width="1.4" style="fill:#362a15;stroke:#eb9a45"/><text x="30" y="148.5" font-size="13.5" font-weight="700" style="fill:#ebefed">The person</text><text x="30" y="164" font-size="11" style="fill:#c0c7c4">Asks, approves, and carries what the two</text><text x="30" y="177.5" font-size="11" style="fill:#c0c7c4">platforms do not pass to each other</text></g><g data-session="scout"><rect data-card="" x="20" y="271" width="278" height="105" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="292" font-size="13.5" font-weight="700" style="fill:#ebefed">Scout</text><text x="30" y="306" font-size="10.5" font-weight="700" style="fill:#5dbb94">grok-bot</text><text x="30" y="321.5" font-size="11" style="fill:#c0c7c4">Watches the sources and gathers what</text><text x="30" y="335" font-size="11" style="fill:#c0c7c4">changed</text><text x="30" y="349" font-size="10" style="fill:#99a19e">long-lived</text><circle data-wakes="" cx="34.2" cy="360.6" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:#a88be0"/><text x="43" y="364" font-size="10" font-weight="700" style="fill:#a88be0">wakes itself · weekdays at 8:00</text></g><g data-session="scribe"><rect data-card="" x="20" y="384" width="278" height="76.5" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="405" font-size="13.5" font-weight="700" style="fill:#ebefed">Scribe</text><text x="30" y="419" font-size="10.5" font-weight="700" style="fill:#5dbb94">grok-bot</text><text x="30" y="434.5" font-size="11" style="fill:#c0c7c4">Turns what Scout found into a draft</text><text x="30" y="448.5" font-size="10" style="fill:#99a19e">long-lived</text></g><g data-session="dot"><rect data-card="" x="20" y="535" width="278" height="105" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="556" font-size="13.5" font-weight="700" style="fill:#ebefed">The dot</text><text x="30" y="570" font-size="10.5" font-weight="700" style="fill:#5dbb94">chatgpt · GPT-6 Astra</text><text x="30" y="585.5" font-size="11" style="fill:#c0c7c4">Keeps the plan current and brings back</text><text x="30" y="599" font-size="11" style="fill:#c0c7c4">decisions</text><text x="30" y="613" font-size="10" style="fill:#99a19e">long-lived</text><circle data-wakes="" cx="34.2" cy="624.6" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:#a88be0"/><text x="43" y="628" font-size="10" font-weight="700" style="fill:#a88be0">wakes itself · weekdays at 9:00</text></g><g data-session="dot-threads"><rect data-card="" x="20" y="648" width="278" height="90" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="669" font-size="13.5" font-weight="700" style="fill:#ebefed">The dot's cloud threads</text><text x="30" y="683" font-size="10.5" font-weight="700" style="fill:#5dbb94">chatgpt</text><text x="30" y="698.5" font-size="11" style="fill:#c0c7c4">One piece of the dot's work each, in a</text><text x="30" y="712" font-size="11" style="fill:#c0c7c4">conversation of its own</text><text x="30" y="726" font-size="10" style="fill:#99a19e">per task</text></g><g data-plate="h-job"><circle cx="314" cy="220" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/></g><g data-plate="h-found"><circle cx="314" cy="372.9" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/></g><g data-plate="h-files"><circle cx="327" cy="393.9" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#99a19e"/></g><g dat