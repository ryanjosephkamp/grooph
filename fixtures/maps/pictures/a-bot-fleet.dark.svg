" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="936" font-size="11" style="fill:#c0c7c4">what changed, as a message from one Bot to another</text></g><g data-handoff-row="h-files"><rect data-row="" x="8" y="945" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="955" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#99a19e"/><text x="20" y="958.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">4</text><text x="36" y="959" font-size="12" font-weight="700" style="fill:#ebefed">Scout → Scribe</text><path d="M36,969.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3" style="stroke:#99a19e"/><text x="60" y="973" font-size="11" font-weight="700" style="fill:#99a19e">files in /workspace on the computer they share</text><text x="36" y="986.5" font-size="11" style="fill:#c0c7c4">the sources Scout saved</text></g><g data-handoff-row="h-draft"><rect data-row="" x="8" y="995.5" width="384" height="61" rx="8" style="fill:transparent"/><circle cx="20" cy="1005.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/><text x="20" y="1008.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">5</text><text x="36" y="1009.5" font-size="12" font-weight="700" style="fill:#ebefed">Scribe → The person</text><path d="M36,1020 h18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><text x="60" y="1023.5" font-size="11" font-weight="700" style="fill:#3cc0d0">notification, the Grok Bot app, on the desktop or</text><text x="60" y="1037" font-size="11" font-weight="700" style="fill:#3cc0d0">the phone</text><text x="36" y="1050.5" font-size="11" style="fill:#c0c7c4">a draft, and a request to approve sending it on</text></g><g data-handoff-row="h-carry"><rect data-row="" x="8" y="1059.5" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="1069.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#eb9a45"/><text x="20" y="1072.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">6</text><text x="36" y="1073.5" font-size="12" font-weight="700" style="fill:#ebefed">The person → The dot</text><path d="M36,1084 h18" fill="none" stroke-width="2.4" stroke-linecap="round" style="stroke:#eb9a45"/><text x="60" y="1087.5" font-size="11" font-weight="700" style="fill:#eb9a45">carried by The person</text><text x="36" y="1101" font-size="11" style="fill:#c0c7c4">pastes the draft into the dot's chat, with what to do with it</text></g><g data-handoff-row="h-piece"><rect data-row="" x="8" y="1110" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="1120" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="1123.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">7</text><text x="36" y="1124" font-size="12" font-weight="700" style="fill:#ebefed">The dot → The dot's cloud threads</text><path d="M36,1134.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="1138" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="1151.5" font-size="11" style="fill:#c0c7c4">instructions and context for one piece</text></g><g data-handoff-row="h-result"><rect data-row="" x="8" y="1160.5" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="1170.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="1173.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">8</text><text x="36" y="1174.5" font-size="12" font-weight="700" style="fill:#ebefed">The dot's cloud threads → The dot</text><path d="M36,1185 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="1188.5" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="1202" font-size="11" style="fill:#c0c7c4">the result, which the dot checks</text></g><g data-handoff-row="h-recurring"><rect data-row="" x="8" y="1211" width="384" height="61" rx="8" style="fill:transparent"/><circle cx="20" cy="1221" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/><text x="20" y="1224.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">9</text><text x="36" y="1225" font-size="12" font-weight="700" style="fill:#ebefed">The dot → itself</text><path d="M36,1235.5 h18" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><text x="60" y="1239" font-size="11" font-weight="700" style="fill:#a88be0">scheduled message, weekdays at 9:00</text><text x="36" y="1252.5" font-size="11" style="fill:#c0c7c4">a recurring task with an end date: check the planning</text><text x="36" y="1266" font-size="11" style="fill:#c0c7c4">channel</text></g><g data-handoff-row="h-decision"><rect data-row="" x="8" y="1275" width="384" height="61" rx="8" style="fill:transparent"/><rect x="11.5" y="1277.8" width="16.9" height="14.4" rx="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/><text x="20" y="1288.3" font-size="8.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">10</text><text x="36" y="1289" font-size="12" font-weight="700" style="fill:#ebefed">The dot → The person</text><path d="M36,1299.5 h18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><text x="60" y="1303" font-size="11" font-weight="700" style="fill:#3cc0d0">notification, ChatGPT, or Slack where the person</text><text x="60" y="1316.5" font-size="11" font-weight="700" style="fill:#3cc0d0">asked for that</text><text x="36" y="1330" font-size="11" style="fill:#c0c7c4">a result, or a decision that needs them</text></g></svg>
