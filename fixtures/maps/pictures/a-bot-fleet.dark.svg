 font-weight="700" text-anchor="middle" style="fill:#ebefed">1</text><text x="36" y="794" font-size="12" font-weight="700" style="fill:#ebefed">The person → Scout</text><path d="M36,804.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="808" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="821.5" font-size="11" style="fill:#c0c7c4">a standing job, typed in Scout's chat</text></g><g data-handoff-row="h-routine"><rect data-row="" x="8" y="830.5" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="840.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/><text x="20" y="843.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">2</text><text x="36" y="844.5" font-size="12" font-weight="700" style="fill:#ebefed">Scout → itself</text><path d="M36,855 h18" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><text x="60" y="858.5" font-size="11" font-weight="700" style="fill:#a88be0">scheduled message, weekdays at 8:00</text><text x="36" y="872" font-size="11" style="fill:#c0c7c4">a routine, in the person's time zone: check the sources</text></g><g data-handoff-row="h-found"><rect data-row="" x="8" y="881" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="891" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="894.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">3</text><text x="36" y="895" font-size="12" font-weight="700" style="fill:#ebefed">Scout → Scribe</text><path d="M36,905.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="909" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="922.5" font-size="11" style="fill:#c0c7c4">what changed, as a message from one Bot to another</text></g><g data-handoff-row="h-files"><rect data-row="" x="8" y="931.5" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="941.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#99a19e"/><text x="20" y="944.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">4</text><text x="36" y="945.5" font-size="12" font-weight="700" style="fill:#ebefed">Scout → Scribe</text><path d="M36,956 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3" style="stroke:#99a19e"/><text x="60" y="959.5" font-size="11" font-weight="700" style="fill:#99a19e">files in /workspace on the computer they share</text><text x="36" y="973" font-size="11" style="fill:#c0c7c4">the sources Scout saved</text></g><g data-handoff-row="h-draft"><rect data-row="" x="8" y="982" width="384" height="61" rx="8" style="fill:transparent"/><circle cx="20" cy="992" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/><text x="20" y="995.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">5</text><text x="36" y="996" font-size="12" font-weight="700" style="fill:#ebefed">Scribe → The person</text><path d="M36,1006.5 h18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><text x="60" y="1010" font-size="11" font-weight="700" style="fill:#3cc0d0">notification, the Grok Bot app, on the desktop or</text><text x="60" y="1023.5" font-size="11" font-weight="700" style="fill:#3cc0d0">the phone</text><text x="36" y="1037" font-size="11" style="fill:#c0c7c4">a draft, and a request to approve sending it on</text></g><g data-handoff-row="h-carry"><rect data-row="" x="8" y="1046" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="1056" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#eb9a45"/><text x="20" y="1059.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">6</text><text x="36" y="1060" font-size="12" font-weight="700" style="fill:#ebefed">The person → The dot</text><path d="M36,1070.5 h18" fill="none" stroke-width="2.4" stroke-linecap="round" style="stroke:#eb9a45"/><text x="60" y="1074" font-size="11" font-weight="700" style="fill:#eb9a45">carried by The person</text><text x="36" y="1087.5" font-size="11" style="fill:#c0c7c4">pastes the draft into the dot's chat, with what to do with it</text></g><g data-handoff-row="h-piece"><rect data-row="" x="8" y="1096.5" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="1106.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="1109.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">7</text><text x="36" y="1110.5" font-size="12" font-weight="700" style="fill:#ebefed">The dot → The dot's cloud threads</text><path d="M36,1121 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="1124.5" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="1138" font-size="11" style="fill:#c0c7c4">instructions and context for one piece</text></g><g data-handoff-row="h-result"><rect data-row="" x="8" y="1147" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="1157" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="1160.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">8</text><text x="36" y="1161" font-size="12" font-weight="700" style="fill:#ebefed">The dot's cloud threads → The dot</text><path d="M36,1171.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="1175" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="1188.5" font-size="11" style="fill:#c0c7c4">the result, which the dot checks</text></g><g data-handoff-row="h-recurring"><rect data-row="" x="8" y="1197.5" width="384" height="61" rx="8" style="fill:transparent"/><circle cx="20" cy="1207.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/><text x="20" y="1210.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">9</text><text x="36" y="1211.5" font-size="12" font-weight="700" style="fill:#ebefed">The dot → itself</text><path d="M36,1222 h18" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><text x="60" y="1225.5" font-size="11" font-weight="700" style="fill:#a88be0">scheduled message, weekdays at 9:00</text><text x="36" y="1239" font-size="11" style="fill:#c0c7c4">a recurring task with an end date: check the planning</text><text x="36" y="1252.5" font-size="11" style="fill:#c0c7c4">channel</text></g><g data-handoff-row="h-decision"><rect data-row="" x="8" y="1261.5" width="384" height="61" rx="8" style="fill:transparent"/><rect x="11.5" y="1264.3" width="16.9" height="14.4" rx="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/><text x="20" y="1274.8" font-size="8.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">10</text><text x="36" y="1275.5" font-size="12" font-weight="700" style="fill:#ebefed">The dot → The person</text><path d="M36,1286 h18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><text x="60" y="1289.5" font-size="11" font-weight="700" style="fill:#3cc0d0">notification, ChatGPT, or Slack where the person</text><text x="60" y="1303" font-size="11" font-weight="700" style="fill:#3cc0d0">asked for that</text><text x="36" y="1316.5" font-size="11" style="fill:#c0c7c4">a result, or a decision that needs them</text></g></svg>
