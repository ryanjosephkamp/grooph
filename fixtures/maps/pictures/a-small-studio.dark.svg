<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="map" viewBox="0 0 400 999" width="400" height="999" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A small studio</title><rect x="0" y="0" width="400" height="999" style="fill:#111514"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#ebefed">A small studio</text><text x="12" y="52" font-size="11" style="fill:#99a19e">3 lanes · 3 sessions · 1 person · 7 handoffs, 2 waiting on a</text><text x="12" y="65" font-size="11" style="fill:#99a19e">person</text><g data-people=""><rect x="12" y="77" width="376" height="93.5" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="97" font-size="12.5" font-weight="700" style="fill:#ebefed">Person</text></g><g data-lane="laptop"><rect x="12" y="180.5" width="376" height="133" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="200.5" font-size="12.5" font-weight="700" style="fill:#ebefed">Laptop</text><rect x="274.8" y="189.7" width="36.2" height="14.7" rx="7.4" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="292.9" y="200" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">local</text><text x="22" y="214" font-size="10.5" style="fill:#99a19e">a laptop · account A</text></g><g data-lane="laptop-b"><rect x="12" y="323.5" width="376" height="127.5" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="343.5" font-size="12.5" font-weight="700" style="fill:#ebefed">Laptop, second account</text><rect x="274.8" y="332.7" width="36.2" height="14.7" rx="7.4" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="292.9" y="343" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">local</text><text x="22" y="357" font-size="10.5" style="fill:#99a19e">a laptop · account B</text></g><g data-lane="cloud"><rect x="12" y="461" width="376" height="142.5" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="481" font-size="12.5" font-weight="700" style="fill:#ebefed">Cloud</text><rect x="270.9" y="470.2" width="40.1" height="14.7" rx="7.4" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="291" y="480.5" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">cloud</text><text x="22" y="494.5" font-size="10.5" style="fill:#99a19e">cloud sandboxes · account A</text></g><g data-person="maker"><rect data-card="" x="20" y="106.5" width="291" height="56" rx="14" stroke-width="1.4" style="fill:#362a15;stroke:#eb9a45"/><text x="30" y="127.5" font-size="13.5" font-weight="700" style="fill:#ebefed">The maker</text><text x="30" y="143" font-size="11" style="fill:#c0c7c4">Decides what to build and merges each change</text></g><g data-session="builder"><rect data-card="" x="20" y="223.5" width="291" height="82" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="244.5" font-size="13.5" font-weight="700" style="fill:#ebefed">Builder</text><text x="30" y="258.5" font-size="10.5" font-weight="700" style="fill:#5dbb94">Claude Code</text><text x="30" y="274" font-size="11" style="fill:#c0c7c4">Builds each change on a branch of its own</text><text x="30" y="288" font-size="10" style="fill:#99a19e">long-lived · studio/app</text></g><g data-session="reviewer"><rect data-card="" x="20" y="366.5" width="291" height="76.5" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="387.5" font-size="13.5" font-weight="700" style="fill:#ebefed">Reviewer</text><text x="30" y="401.5" font-size="10.5" font-weight="700" style="fill:#6fa3e0">Codex</text><text x="30" y="417" font-size="11" style="fill:#c0c7c4">Reads a pull request and writes a review</text><text x="30" y="431" font-size="10" style="fill:#99a19e">per task · studio/app</text></g><g data-session="docs"><rect data-card="" x="20" y="504" width="291" height="91.5" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="525" font-size="13.5" font-weight="700" style="fill:#ebefed">Docs writer</text><text x="30" y="539" font-size="10.5" font-weight="700" style="fill:#5dbb94">Claude Code</text><text x="30" y="554.5" font-size="11" style="fill:#c0c7c4">Keeps the user guide in step with the app</text><text x="30" y="568.5" font-size="10" style="fill:#99a19e">scheduled · studio/app</text><circle data-wakes="" cx="34.2" cy="580.1" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:#a88be0"/><text x="43" y="583.5" font-size="10" font-weight="700" style="fill:#a88be0">wakes itself · weekdays at 9:00</text></g><g data-plate="h-ask"><circle cx="327" cy="180" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/></g><g data-plate="h-pr"><circle cx="327" cy="331.4" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#6fa3e0"/></g><g data-plate="h-review"><circle cx="340" cy="352.4" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#eb9a45"/></g><g data-plate="h-ready"><circle cx="340" cy="201" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/></g><g data-plate="h-notes"><circle cx="353" cy="410.4" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#99a19e"/></g><g data-plate="h-guide"><circle cx="366" cy="345.4" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#6fa3e0"/></g><g data-handoff="h-ask"><path d="M311,121.5 H321 Q327,121.5 327,127.5 V172.8 M327,187.2 V232.5 Q327,238.5 321,238.5 H316.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="311" cy="121.5" r="2.2" style="fill:#c0c7c4"/><path d="M311.5,238.5 l6.5,-3.6 v7.2 z" style="fill:#c0c7c4"/></g><g data-handoff="h-pr"><path d="M311,264.5 H321 Q327,264.5 327,270.5 V324.2 M327,338.6 V392.3 Q327,398.3 321,398.3 H316.5" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#6fa3e0"/><circle cx="311" cy="264.5" r="2