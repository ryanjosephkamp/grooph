<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="sequence" viewBox="0 0 580 478" width="580" height="478" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A small studio</title><rect x="0" y="0" width="580" height="478" style="fill:#f1f4f3"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#1a201e">A small studio</text><text x="12" y="52" font-size="11" style="fill:#5f6764">3 lanes · 3 sessions · 1 person · 7 handoffs, 2 waiting on a</text><text x="12" y="65" font-size="11" style="fill:#5f6764">person</text><text x="12" y="79" font-size="11" style="fill:#454c49">Read down: the order the map lists its handoffs in. An order, not</text><text x="12" y="93" font-size="11" style="fill:#454c49">a clock: a map records no times.</text><text x="298" y="172.5" font-size="10" style="fill:#5f6764">Carried by, and what is handed</text><g data-people=""><rect x="13.5" y="105" width="65" height="361" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#e8edeb;stroke:#dce1df"/><text x="46" y="121" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">Person</text></g><g data-lane="laptop"><rect x="81.5" y="105" width="65" height="361" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="114" y="121" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">Laptop</text></g><g data-lane="laptop-b"><rect x="149.5" y="105" width="65" height="361" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="182" y="121" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">Laptop,</text><text x="182" y="133" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">second</text><text x="182" y="145" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">account</text></g><g data-lane="cloud"><rect x="217.5" y="105" width="65" height="361" rx="12