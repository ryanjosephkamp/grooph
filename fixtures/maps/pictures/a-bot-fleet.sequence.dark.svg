<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="sequence" viewBox="0 0 618 717" width="618" height="717" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A bot fleet: two Bots, a dot and their person</title><rect x="0" y="0" width="618" height="717" style="fill:#111514"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#ebefed">A bot fleet: two Bots, a dot and their</text><text x="12" y="56" font-size="17" font-weight="700" style="fill:#ebefed">person</text><text x="12" y="73" font-size="11" style="fill:#99a19e">as of 2026-10-05 · 2 lanes · 4 sessions · 1 person · 10 handoffs,</text><text x="12" y="86" font-size="11" style="fill:#99a19e">2 waiting on a person</text><text x="12" y="100" font-size="11" style="fill:#c0c7c4">Read down: the order the map lists its handoffs in. An order, not</text><text x="12" y="114" font-size="11" style="fill:#c0c7c4">a clock: a map records no times.</text><text x="336" y="194" font-size="10" style="fill:#99a19e">Carried by, and what is handed</text><g data-people=""><rect x="13.5" y="126" width="59" height="579" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#242a27;stroke:#2d3331"/><text x="43" y="142" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">Person</text></g><g data-lane="bots-computer"><rect x="75.5" y="126" width="121" height="579" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="136" y="142" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">The Bots' cloud</text><text x="136" y="154" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">computer</text></g><g data-lane="dot-computer"><rect x="199.5" y="126" width="121" height="579" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="260" y="142" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">The dot's cloud</text><text x="260" y="154" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">computer</text></g><path d="M12,266 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M12,317 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M12,368 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M12,419 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M12,470 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M12,521 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M12,559 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M12,597 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M12,648 H606" stroke-width="1" style="stroke:#2d3331"/><path d="M43,220 V699" stroke-width="1" style="stroke:#4a524f"/><path d="M105,220 V699" stroke-width="1" style="stroke:#4a524f"/><path d="M167,220 V699" stroke-width="1" style="stroke:#4a524f"/><path d="M229,220 V699" stroke-width="1" style="stroke:#4a524f"/><path d="M291,220 V699" stroke-width="1" style="stroke:#4a524f"/><g data-person="person"><rect data-card="" x="16" y="161" width="54" height="59" rx="12" stroke-width="1.4" style="fill:#362a15;stroke:#eb9a45"/><text x="43" y="187.5" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">The</text><text x="43" y="200" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">person</text></g><g data-session="scout"><rect data-card="" x="78" y="161" width="54" height="59" rx="8" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="105" y="193.8" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">Scout</text></g><g data-session="scribe"><rect data-card="" x="140" y="161" width="54" height="59" rx="8" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="167" y="193.8" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">Scribe</text></g><g data-session="dot"><rect data-card="" x="202" y="161" width="54" height="59" rx="8" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="229" y="193.8" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">The dot</text></g><g data-session="dot-threads"><rect data-card="" x="264" y="161" width="54" height="59" rx="8" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="291" y="175" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">The</text><text x="291" y="187.5" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">dot's</text><text x="291" y="200" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">cloud</text><text x="291" y="212.5" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">threads</text></g><g data-handoff="h-job"><rect data-row="" x="8" y="229.5" width="602" height="35" rx="8" style="fill:transparent"/><path d="M43,247 H99.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="43" cy="247" r="2.2" style="fill:#c0c7c4"/><path d="M104.5,247 l-6.5,-3.6 v7.2 z" style="fill:#c0c7c4"/><circle cx="62" cy="247" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="62" y="250.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">1</text><text x="336" y="244" font-size="10.5" font-weight="700" style="fill:#c0c7c4">session message</text><text x="336" y="257" font-size="10.5" style="fill:#c0c7c4">a standing job, typed in Scout's chat</text></g><g data-handoff="h-routine"><rect data-row="" x="8" y="267.5" width="602" height="48" rx="8" style="fill:transparent"/><path d="M105,285.5 h20 v12 H110.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><circle cx="105" cy="285.5" r="2.2" style="fill:#a88be0"/><path d="M105.5,297.5 l6.5,-3.6 v7.2 z" style="fill:#a88be0"/><circle cx="125" cy="291.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/><text x="125" y="294.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">2</text><text x="336" y="282" font-size="10.5" font-weight="700" style="fill:#a88be0">scheduled message, weekdays at 8:00</text><text x="336" y="295" font-size="10.5" style="fill:#c0c7c4">a routine, in the person's time zone: check the</text><text x="336" y="308" font-size="10.5" style="fill:#c0c7c4">sources</text></g><g data-handoff="h-found"><rect data-row="" x="8" y="318.5" width="602" height="48" rx="8" style="fill:transparent"/><path d="M105,342.5 H161.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="105" cy="342.5" r="2.2" style="fill:#c0c7c4"/><path d="M166.5,342.5 l-6.5,-3.6 v7.2 z" style="fill:#c0c7c4"/><circle cx="124" cy="342.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="124" y="345.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">3</text><text x="336" y="333" font-size="10.5" font-weight="700" style="fill:#c0c7c4">session message</text><text x="336" y="346" font-size="10.5" style="fill:#c0c7c4">what changed, as a message from one Bot to</text><text x="336" y="359" font-size="10.5" style="fill:#c0c7c4">another</text></g><g data-handoff="h-files"><rect data-row="" x="8" y="369.5" width="602" height="48" rx="8" style="fill:transparent"/><path d="M105,393.5 H161.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3" style="stroke:#99a19e"/><circle cx="105" cy="393.5" r="2.2" style="fill:#99a19e"/><path d="M166.5,393.5 l-6.5,-3.6 v7.2 z" style="fill:#99a19e"/><circle cx="124" cy="393.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#99a19e"/><text x="124" y="396.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">4</text><text x="336" y="384" font-size="10.5" font-weight="700" style="fill:#99a19e">files in /workspace on the computer they</text><text x="336" y="397" font-size="10.5" font-weight="700" style="fill:#99a19e">share</text><text x="336" y="410" font-size="10.5" style="fill:#c0c7c4">the sources Scout saved</text></g><g data-handoff="h-draft"><rect data-row="" x="8" y="420.5" width="602" height="48" rx="8" style="fill:transparent"/><path d="M167,444.5 H48.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><circle cx="167" cy="444.5" r="2.2" style="fill:#3cc0d0"/><path d="M43.5,444.5 l6.5,-3.6 v7.2 z" style="fill:#3cc0d0"/><circle cx="148" cy="444.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/><text x="148" y="447.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">5</text><text x="336" y="435" font-size="10.5" font-weight="700" style="fill:#3cc0d0">notification, the Grok Bot app, on the</text><text x="336" y="448" font-size="10.5" font-weight="700" style="fill:#3cc0d0">desktop or the phone</text><text x="336" y="461" font-size="10.5" style="fill:#c0c7c4">a draft, and a request to approve sending it on</text></g><g data-handoff="h-carry"><rect data-row="" x="8" y="471.5" width="602" height="48" rx="8" style="fill:transparent"/><path d="M43,495.5 H223.5" fill="none" stroke-width="2.4" stroke-linecap="round" style="stroke:#eb9a45"/><circle cx="43" cy="495.5" r="2.2" style="fill:#eb9a45"/><path d="M228.5,495.5 l-6.5,-3.6 v7.2 z" style="fill:#eb9a45"/><circle cx="62" cy="495.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#eb9a45"/><text x="62" y="498.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">6</text><text x="336" y="486" font-size="10.5" font-weight="700" style="fill:#eb9a45">carried by The person</text><text x="336" y="499" font-size="10.5" style="fill:#c0c7c4">pastes the draft into the dot's chat, with what to</text><text x="336" y="512" font-size="10.5" style="fill:#c0c7c4">do with it</text></g><g data-handoff="h-piece"><rect data-row="" x="8" y="522.5" width="602" height="35" rx="8" style="fill:transparent"/><path d="M229,540 H285.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="229" cy="540" r="2.2" style="fill:#c0c7c4"/><path d="M290.5,540 l-6.5,-3.6 v7.2 z" style="fill:#c0c7c4"/><circle cx="248" cy="540" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="248" y="543.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">7</text><text x="336" y="537" font-size="10.5" font-weight="700" style="fill:#c0c7c4">session message</text><text x="336" y="550" font-size="10.5" style="fill:#c0c7c4">instructions and context for one piece</text></g><g data-handoff="h-result"><rect data-row="" x="8" y="560.5" width="602" height="35" rx="8" style="fill:transparent"/><path d="M291,578 H234.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="291" cy="578" r="2.2" style="fill:#c0c7c4"/><path d="M229.5,578 l6.5,-3.6 v7.2 z" style="fill:#c0c7c4"/><circle cx="272" cy="578" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="272" y="581.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">8</text><text x="336" y="575" font-size="10.5" font-weight="700" style="fill:#c0c7c4">session message</text><text x="336" y="588" font-size="10.5" style="fill:#c0c7c4">the result, which the dot checks</text></g><g data-handoff="h-recurring"><rect data-row="" x="8" y="598.5" width="602" height="48" rx="8" style="fill:transparent"/><path d="M229,616.5 h20 v12 H234.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><circle cx="229" cy="616.5" r="2.2" style="fill:#a88be0"/><path d="M229.5,628.5 l6.5,-3.6 v7.2 z" style="fill:#a88be0"/><circle cx="249" cy="622.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/><text x="249" y="625.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">9</text><text x="336" y="613" font-size="10.5" font-weight="700" style="fill:#a88be0">scheduled message, weekdays at 9:00</text><text x="336" y="626" font-size="10.5" style="fill:#c0c7c4">a recurring task with an end date: check the</text><text x="336" y="639" font-size="10.5" style="fill:#c0c7c4">planning channel</text></g><g data-handoff="h-decision"><rect data-row="" x="8" y="649.5" width="602" height="48" rx="8" style="fill:transparent"/><path d="M229,673.5 H48.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><circle cx="229" cy="673.5" r="2.2" style="fill:#3cc0d0"/><path d="M43.5,673.5 l6.5,-3.6 v7.2 z" style="fill:#3cc0d0"/><rect x="201.5" y="666.3" width="16.9" height="14.4" rx="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/><text x="210" y="676.8" font-size="8.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">10</text><text x="336" y="664" font-size="10.5" font-weight="700" style="fill:#3cc0d0">notification, ChatGPT, or Slack where the</text><text x="336" y="677" font-size="10.5" font-weight="700" style="fill:#3cc0d0">person asked for that</text><text x="336" y="690" font-size="10.5" style="fill:#c0c7c4">a result, or a decision that needs them</text></g></svg>
