<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="sequence" viewBox="0 0 494 365" width="494" height="365" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A person and two sessions</title><rect x="0" y="0" width="494" height="365" style="fill:#f1f4f3"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#1a201e">A person and two sessions</text><text x="12" y="52" font-size="11" style="fill:#5f6764">1 lane · 2 sessions · 1 person · 5 handoffs, 1 waiting on a person</text><text x="12" y="66" font-size="11" style="fill:#454c49">Read down: the order the map lists its handoffs in. An order, not</text><text x="12" y="80" font-size="11" style="fill:#454c49">a clock: a map records no times.</text><text x="212" y="135.5" font-size="10" style="fill:#5f6764">Carried by, and what is handed</text><g data-people=""><rect x="13.5" y="92" width="59" height="261" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#e8edeb;stroke:#dce1df"/><text x="43" y="108" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">Person</text></g><g data-lane="laptop"><rect x="75.5" y="92" width="121" height="261" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="136" y="108" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">Laptop</text></g><path d="M12,195 H482" stroke-width="1" style="stroke:#dce1df"/><path d="M12,233 H482" stroke-width="1" style="stroke:#dce1df"/><path d="M12,271 H482" stroke-width="1" style="stroke:#dce1df"/><path d="M12,309 H482" stroke-width="1" style="stroke:#dce1df"/><path d="M43,149 V347" stroke-width="1" style="stroke:#b9c1be"/><path d="M105,149 V347" stroke-width="1" style="stroke:#b9c1be"/><path d="M167,149 V347" stroke-width="1" style="stroke:#b9c1be"/><g data-person="owner"><rect data-card="" x="16" y="115" width="54" height="34" rx="12" stroke-width="1.4" style="fill:#fcf0d9;stroke:#b25e09"/><text x="43" y="129" font-size="10" font-weight="700" text-anchor="middle" style="fill:#1a201e">The</text><text x="43" y="141.5" font-size="10" font-weight="700" text-anchor="middle" style="fill:#1a201e">owner</text></g><g data-session="lead"><rect data-card="" x="78" y="115" width="54" height="34" rx="8" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="105" y="135.3" font-size="10" font-weight="700" text-anchor="middle" style="fill:#1a201e">Lead</text></g><g data-session="worker"><rect data-card="" x="140" y="115" width="54" height="34" rx="8" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="167" y="135.3" font-size="10" font-weight="700" text-anchor="middle" style="fill:#1a201e">Worker</text></g><g data-handoff="h-ask"><rect data-row="" x="8" y="158.5" width="478" height="35" rx="8" style="fill:transparent"/><path d="M43,176 H99.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><circle cx="43" cy="176" r="2.2" style="fill:#454c49"/><path d="M104.5,176 l-6.5,-3.6 v7.2 z" style="fill:#454c49"/><circle cx="62" cy="176" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/><text x="62" y="179.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">1</text><text x="212" y="173" font-size="10.5" font-weight="700" style="fill:#454c49">session message</text><text x="212" y="186" font-size="10.5" style="fill:#454c49">what is wanted</text></g><g data-handoff="h-start"><rect data-row="" x="8" y="196.5" width="478" height="35" rx="8" style="fill:transparent"/><path d="M105,214 H161.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><circle cx="105" cy="214" r="2.2" style="fill:#454c49"/><path d="M166.5,214 l-6.5,-3.6 v7.2 z" style="fill:#454c49"/><circle cx="124" cy="214" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/><text x="124" y="217.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">2</text><text x="212" y="211" font-size="10.5" font-weight="700" style="fill:#454c49">session message</text><text x="212" y="224" font-size="10.5" style="fill:#454c49">one piece</text></g><g data-handoff="h-back"><rect data-row="" x="8" y="234.5" width="478" height="35" rx="8" style="fill:transparent"/><path d="M167,252 H110.5" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#1f5f4a"/><circle cx="167" cy="252" r="2.2" style="fill:#1f5f4a"/><path d="M105.5,252 l6.5,-3.6 v7.2 z" style="fill:#1f5f4a"/><circle cx="148" cy="252" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#1f5f4a"/><text x="148" y="255.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">3</text><text x="212" y="249" font-size="10.5" font-weight="700" style="fill:#1f5f4a">branch on example/app</text><text x="212" y="262" font-size="10.5" style="fill:#454c49">the piece, on a branch</text></g><g data-handoff="h-wake"><rect data-row="" x="8" y="272.5" width="478" height="35" rx="8" style="fill:transparent"/><path d="M105,284 h20 v12 H110.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#6b4fa0"/><circle cx="105" cy="284" r="2.2" style="fill:#6b4fa0"/><path d="M105.5,296 l6.5,-3.6 v7.2 z" style="fill:#6b4fa0"/><circle cx="125" cy="290" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#6b4fa0"/><text x="125" y="293.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">4</text><text x="212" y="287" font-size="10.5" font-weight="700" style="fill:#6b4fa0">scheduled message, every hour</text><text x="212" y="300" font-size="10.5" style="fill:#454c49">its own check-in</text></g><g data-handoff="h-done"><rect data-row="" x="8" y="310.5" width="478" height="35" rx="8" style="fill:transparent"/><path d="M105,328 H48.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#0f7c8c"/><circle cx="105" cy="328" r="2.2" style="fill:#0f7c8c"/><path d="M43.5,328 l6.5,-3.6 v7.2 z" style="fill:#0f7c8c"/><circle cx="86" cy="328" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#0f7c8c"/><text x="86" y="331.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">5</text><text x="212" y="325" font-size="10.5" font-weight="700" style="fill:#0f7c8c">notification, e-mail</text><text x="212" y="338" font-size="10.5" style="fill:#454c49">done, with a link</text></g></svg>
