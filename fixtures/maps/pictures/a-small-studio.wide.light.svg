<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="map" viewBox="0 0 718 598" width="718" height="598" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A small studio</title><rect x="0" y="0" width="718" height="598" style="fill:#f1f4f3"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#1a201e">A small studio</text><text x="12" y="52" font-size="11" style="fill:#5f6764">3 lanes · 3 sessions · 1 person · 7 handoffs, 2 waiting on a person</text><g data-people=""><rect x="12" y="64" width="694" height="86" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#e8edeb;stroke:#dce1df"/><text x="22" y="84" font-size="12.5" font-weight="700" style="fill:#1a201e">Person</text></g><g data-lane="laptop"><rect x="52" y="170" width="184" height="184" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="62" y="190" font-size="12.5" font-weight="700" style="fill:#1a201e">Laptop</text><rect x="191.8" y="179.2" width="36.2" height="14.7" rx="7.4" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="209.9" y="189.5" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">local</text><text x="62" y="203.5" font-size="10.5" style="fill:#5f6764">a laptop · account A</text></g><g data-lane="laptop-b"><rect x="280" y="170" width="184" height="184" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="290" y="190" font-size="12.5" font-weight="700" style="fill:#1a201e">Laptop, second</text><rect x="419.8" y="179.2" width="36.2" height="14.7" rx="7.4" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="437.9" y="189.5" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">local</text><text x="290" y="205" font-size="12.5" font-weight="700" style="fill:#1a201e">account</text><text x="290" y="218.5" font-size="10.5" style="fill:#5f6764">a laptop · account B</text></g><g data-lane="cloud"><rect x="495" y="170" width="184" height="184" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="505" y="190" font-size="12.5" font-weight="700" style="fill:#1a201e">Cloud</text><rect x="630.9" y="179.2" width="40.1" height="14.7" rx="7.4" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="651" y="189.5" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">cloud</text><text x="505" y="203.5" font-size="10.5" style="fill:#5f6764">cloud sandboxes · account A</text></g><g data-person="maker"><rect data-card="" x="20" y="93.5" width="678" height="48.5" rx="14" stroke-width="1.4" style="fill:#fcf0d9;stroke:#b25e09"/><text x="30" y="114.5" font-size="13.5" font-weight="700" style="fill:#1a201e">The maker</text><text x="30" y="130" font-size="11" style="fill:#454c49">Decides what to build and merges each change</text></g><g data-session="builder"><rect data-card="" x="60" y="228" width="168" height="90" rx="9" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="70" y="249" font-size="13.5" font-weight="700" style="fill:#1a201e">Builder</text><text x="70" y="263" font-size="10.5" font-weight="700" style="fill:#1f5f4a">Claude Code</text><text x="70" y="278.5" font-size="11" style="fill:#454c49">Builds each change on a</text><text x="70" y="292" font-size="11" style="fill:#454c49">branch of its own</text><text x="70" y="306" font-size="10" style="fill:#5f6764">long-lived · studio/app</text></g><g data-session="reviewer"><rect data-card="" x="288" y="228" width="168" height="90" rx="9" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="298" y="249" font-size="13.5" font-weight="700" style="fill:#1a201e">Reviewer</text><text x="298" y="263" font-size="10.5" font-weight="700" style="fill:#2b5f9e">Codex</text><text x="298" y="278.5" font-size="11" style="fill:#454c49">Reads a pull request and</text><text x="298" y="292" font-size="11" style="fill:#454c49">writes a review</text><text x="298" y="306" font-size="10" style="fill:#5f6764">per task · studio/app</text></g><g data-session="docs"><rect data-card="" x="503" y="228" width="168" height="118" rx="9" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="513" y="249" font-size="13.5" font-weight="700" style="fill:#1a201e">Docs writer</text><text x="513" y="263" font-size="10.5" font-weight="700" style="fill:#1f5f4a">Claude Code</text><text x="513" y="278.5" font-size="11" style="fill:#454c49">Keeps the user guide in</text><text x="513" y="292" font-size="11" style="fill:#454c49">step with the app</text><text x="513" y="306" font-size="10" style="fill:#5f6764">scheduled · studio/app</text><circle data-wakes="" cx="517.2" cy="317.6" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:#6b4fa0"/><text x="526" y="321" font-size="10" font-weight="700" style="fill:#6b4fa0">wakes itself ·</text><text x="526" y="334" font-size="10" font-weight="700" style="fill:#6b4fa0">weekdays at 9:00</text></g><g data-plate="h-ask"><circle cx="43" cy="205.5" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/></g><g data-plate="h-ready"><circle cx="30" cy="228" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#0f7c8c"/></g><g data-plate="h-notes"><circle cx="473" cy="218.3" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#5f6764"/></g><g data-plate="h-guide"><circle cx="688" cy="213.3" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#2b5f9e"/></g><g data-handoff="h-ask"><path d="M43,142 L43,198.3 M43,212.7 L43,263 Q43,269 49,269 L54.5,269" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><circle cx="43" cy="142" r="2.2" style="fill:#454c49"/><path d="M59.5,269 L53,265.4 L53,272.6 z" style="fill:#454c49"/></g><g data-handoff="h-pr"><path d="M228,270.5 L257.3,270.5 Q258,270.5 258,269.8 L258,269.8 Q258,269 258.8,269 L282.5,269" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#2b5f9e"/><circle cx=