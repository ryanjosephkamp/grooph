<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="map" viewBox="0 0 340 721" width="340" height="721" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A person and two sessions</title><rect x="0" y="0" width="340" height="721" style="fill:#111514"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#ebefed">A person and two sessions</text><text x="12" y="52" font-size="11" style="fill:#99a19e">1 lane · 2 sessions · 1 person · 5 handoffs, 1 waiting</text><text x="12" y="65" font-size="11" style="fill:#99a19e">on a person</text><g data-people=""><rect x="12" y="77" width="316" height="86" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="97" font-size="12.5" font-weight="700" style="fill:#ebefed">Person</text></g><g data-lane="laptop"><rect x="52" y="173" width="184" height="253.5" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="62" y="193" font-size="12.5" font-weight="700" style="fill:#ebefed">Laptop</text><rect x="191.8" y="182.2" width="36.2" height="14.7" rx="7.4" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="209.9" y="192.5" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">local</text><text x="62" y="206.5" font-size="10.5" style="fill:#99a19e">a laptop · one account</text></g><g data-person="owner"><rect data-card="" x="20" y="106.5" width="300" height="48.5" rx="14" stroke-width="1.4" style="fill:#362a15;stroke:#eb9a45"/><text x="30" y="127.5" font-size="13.5" font-weight="700" style="fill:#ebefed">The owner</text><text x="30" y="143" font-size="11" style="fill:#c0c7c4">Asks for the work and reads the result</text></g><g data-session="lead"><rect data-card="" x="60" y="216" width="168" height="118" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="70" y="237" font-size="13.5" font-weight="700" style="fill:#ebefed">Lead</text><text x="70" y="251" font-size="10.5" font-weight="700" style="fill:#5dbb94">Claude Code</text><text x="70" y="266.5" font-size="11" style="fill:#c0c7c4">Plans the work and</text><text x="70" y="280" font-size="11" style="fill:#c0c7c4">checks it</text><text x="70" y="294" font-size="10" style="fill:#99a19e">long-lived</text><circle data-wakes="" cx="74.2" cy="305.6" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:#a88be0"/><text x="83" y="309" font-size="10" font-weight="700" style="fill:#a88be0">wakes itself · every</text><text x="83" y="322" font-size="10" font-weight="700" style="fill:#a88be0">hour</text></g><g data-session="worker"><rect data-card="" x="60" y="342" width="168" height="76.5" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="70" y="363" font-size="13.5" font-weight="700" style="fill:#ebefed">Worker</text><text x="70" y="377" font-size="10.5" font-weight="700" style="fill:#5dbb94">Claude Code</text><text x="70" y="392.5" font-size="11" style="fill:#c0c7c4">Does one piece</text><text x="70" y="406.5" font-size="10" style="fill:#99a19e">per task</text></g><g data-plate="h-ask"><circle cx="43" cy="211.8" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/></g><g data-plate="h-start"><circle cx="258" cy="334.1" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/></g><g data-plate="h-back"><circle cx="271" cy="358.1" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#5dbb94"/></g><g data-plate="h-done"><circle cx="30" cy="234.3" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/></g><g data-handoff="h-ask"><path d="M43,155 L43,204.6 M43,219 L43,262.5 Q43,268.5 49,268.5 L54.5,268.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="43" cy="155" r="2.2" style="fill:#c0c7c4"/><path d="M59.5,268.5 L53,264.9 L53,272.1 z" style="fill:#c0c7c4"/></g><g data-handoff="h-start"><path d="M228,294.5 L252,294.5 Q258,294.5 258,300.5 L258,326.9 M258,341.3 L258,367.8 Q258,373.8 252,373.8 L233.5,373.8" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="228" cy="294.5" r="2.2" style="fill:#c0c7c4"/><path d="M228.5,373.8 L235,377.4 L235,370.2 z" style="fill:#c0c7c4"/></g><g data-handoff="h-back"><path d="M228,386.8 L265,386.8 Q271,386.8 271,380.8 L271,365.3 M271,350.9 L271,287.5 Q271,281.5 265,281.5 L233.5,281.5" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#5dbb94"/><circle cx="228" cy="386.8" r="2.2" style="fill:#5dbb94"/><path d="M228.5,281.5 L235,285.1 L235,277.9 z" style="fill:#5dbb94"/></g><g data-handoff="h-wake"><path d="M228,255.5 L239,255.5 Q245,255.5 245,261.5 L245,262.5 Q245,268.5 239,268.5 L233.5,268.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><circle cx="228" cy="255.5" r="2.2" style="fill:#a88be0"/><path d="M228.5,268.5 L235,272.1 L235,264.9 z" style="fill:#a88be0"/></g><g data-plate="h-wake"><circle cx="245" cy="262" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/></g><g data-handoff="h-done"><path d="M60,281.5 L36,281.5 Q30,281.5 30,275.5 L30,241.5 M30,227.1 L30,160.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><circle cx="60" cy="281.5" r="2.2" style="fill:#3cc0d0"/><path d="M30,155.5 L33.6,162 L26.4,162 z" style="fill:#3cc0d0"/></g><g data-number="h-ask"><text x="43" y="215.1" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">1</text></g><g data-number="h-start"><text x="258" y="337.4" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">2</text></g><g data-number="h-back"><text x="271" y="361.4" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">3</text></g><g data-number="h-wake"><text x="245" y="265.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">4</text></g><g data-number="h-done"><text x="30" y="237.6" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">5</text></g><text x="12" y="453.5" font-size="12.5" font-weight="700" style="fill:#ebefed">Handoffs</text><g data-handoff-row="h-ask"><rect data-row="" x="8" y="460.5" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="470.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="473.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">1</text><text x="36" y="474.5" font-size="12" font-weight="700" style="fill:#ebefed">The owner → Lead</text><path d="M36,485 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="488.5" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="502" font-size="11" style="fill:#c0c7c4">what is wanted</text></g><g data-handoff-row="h-start"><rect data-row="" x="8" y="511" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="521" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="524.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">2</text><text x="36" y="525" font-size="12" font-weight="700" style="fill:#ebefed">Lead → Worker</text><path d="M36,535.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="539" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="552.5" font-size="11" style="fill:#c0c7c4">one piece</text></g><g data-handoff-row="h-back"><rect data-row="" x="8" y="561.5" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="571.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#5dbb94"/><text x="20" y="574.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">3</text><text x="36" y="575.5" font-size="12" font-weight="700" style="fill:#ebefed">Worker → Lead</text><path d="M36,586 h18" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#5dbb94"/><text x="60" y="589.5" font-size="11" font-weight="700" style="fill:#5dbb94">branch on example/app</text><text x="36" y="603" font-size="11" style="fill:#c0c7c4">the piece, on a branch</text></g><g data-handoff-row="h-wake"><rect data-row="" x="8" y="612" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="622" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/><text x="20" y="625.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">4</text><text x="36" y="626" font-size="12" font-weight="700" style="fill:#ebefed">Lead → itself</text><path d="M36,636.5 h18" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><text x="60" y="640" font-size="11" font-weight="700" style="fill:#a88be0">scheduled message, every hour</text><text x="36" y="653.5" font-size="11" style="fill:#c0c7c4">its own check-in</text></g><g data-handoff-row="h-done"><rect data-row="" x="8" y="662.5" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="672.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/><text x="20" y="675.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">5</text><text x="36" y="676.5" font-size="12" font-weight="700" style="fill:#ebefed">Lead → The owner</text><path d="M36,687 h18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><text x="60" y="690.5" font-size="11" font-weight="700" style="fill:#3cc0d0">notification, e-mail</text><text x="36" y="704" font-size="11" style="fill:#c0c7c4">done, with a link</text></g></svg>
