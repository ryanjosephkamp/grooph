<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="map" viewBox="0 0 400 685" width="400" height="685" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A person and two sessions</title><rect x="0" y="0" width="400" height="685" style="fill:#111514"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#ebefed">A person and two sessions</text><text x="12" y="52" font-size="11" style="fill:#99a19e">1 lane · 2 sessions · 1 person · 5 handoffs, 1 waiting on a person</text><g data-people=""><rect x="12" y="64" width="376" height="86" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="84" font-size="12.5" font-weight="700" style="fill:#ebefed">Person</text></g><g data-lane="laptop"><rect x="12" y="160" width="376" height="230.5" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="22" y="180" font-size="12.5" font-weight="700" style="fill:#ebefed">Laptop</text><rect x="300.8" y="169.2" width="36.2" height="14.7" rx="7.4" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="318.9" y="179.5" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">local</text><text x="22" y="193.5" font-size="10.5" style="fill:#99a19e">a laptop · one account</text></g><g data-person="owner"><rect data-card="" x="20" y="93.5" width="317" height="48.5" rx="14" stroke-width="1.4" style="fill:#362a15;stroke:#eb9a45"/><text x="30" y="114.5" font-size="13.5" font-weight="700" style="fill:#ebefed">The owner</text><text x="30" y="130" font-size="11" style="fill:#c0c7c4">Asks for the work and reads the result</text></g><g data-session="lead"><rect data-card="" x="20" y="203" width="317" height="95" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="224" font-size="13.5" font-weight="700" style="fill:#ebefed">Lead</text><text x="30" y="238" font-size="10.5" font-weight="700" style="fill:#5dbb94">Claude Code</text><text x="30" y="253.5" font-size="11" style="fill:#c0c7c4">Plans the work and checks it</text><text x="30" y="267.5" font-size="10" style="fill:#99a19e">long-lived</text><circle data-wakes="" cx="34.2" cy="279.1" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:#a88be0"/><text x="43" y="282.5" font-size="10" font-weight="700" style="fill:#a88be0">wakes itself · every hour</text></g><g data-session="worker"><rect data-card="" x="20" y="306" width="317" height="76.5" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="30" y="327" font-size="13.5" font-weight="700" style="fill:#ebefed">Worker</text><text x="30" y="341" font-size="10.5" font-weight="700" style="fill:#5dbb94">Claude Code</text><text x="30" y="356.5" font-size="11" style="fill:#c0c7c4">Does one piece</text><text x="30" y="370.5" font-size="10" style="fill:#99a19e">per task</text></g><g data-plate="h-ask"><circle cx="353" cy="164.6" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/></g><g data-plate="h-start"><circle cx="353" cy="303.9" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/></g><g data-plate="h-back"><circle cx="366" cy="324.9" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#5dbb94"/></g><g data-plate="h-done"><circle cx="366" cy="185.6" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/></g><g data-handoff="h-ask"><path d="M337,111.3 H347 Q353,111.3 353,117.3 V157.4 M353,171.8 V212 Q353,218 347,218 H342.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="337" cy="111.3" r="2.2" style="fill:#c0c7c4"/><path d="M337.5,218 l6.5,-3.6 v7.2 z" style="fill:#c0c7c4"/></g><g data-handoff="h-start"><path d="M337,270 H347 Q353,270 353,276 V296.7 M353,311.1 V331.8 Q353,337.8 347,337.8 H342.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><circle cx="337" cy="270" r="2.2" style="fill:#c0c7c4"/><path d="M337.5,337.8 l6.5,-3.6 v7.2 z" style="fill:#c0c7c4"/></g><g data-handoff="h-back"><path d="M337,350.8 H360 Q366,350.8 366,344.8 V332.1 M366,317.7 V289 Q366,283 360,283 H342.5" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#5dbb94"/><circle cx="337" cy="350.8" r="2.2" style="fill:#5dbb94"/><path d="M337.5,283 l6.5,-3.6 v7.2 z" style="fill:#5dbb94"/></g><g data-handoff="h-wake"><path d="M337,244 H347 Q353,244 353,250 V251 Q353,257 347,257 H342.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><circle cx="337" cy="244" r="2.2" style="fill:#a88be0"/><path d="M337.5,257 l6.5,-3.6 v7.2 z" style="fill:#a88be0"/></g><g data-plate="h-wake"><circle cx="353" cy="250.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/></g><g data-handoff="h-done"><path d="M337,231 H360 Q366,231 366,225 V192.8 M366,178.4 V130.3 Q366,124.3 360,124.3 H342.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><circle cx="337" cy="231" r="2.2" style="fill:#3cc0d0"/><path d="M337.5,124.3 l6.5,-3.6 v7.2 z" style="fill:#3cc0d0"/></g><g data-number="h-ask"><text x="353" y="167.9" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">1</text></g><g data-number="h-start"><text x="353" y="307.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">2</text></g><g data-number="h-back"><text x="366" y="328.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">3</text></g><g data-number="h-wake"><text x="353" y="253.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">4</text></g><g data-number="h-done"><text x="366" y="188.9" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">5</text></g><text x="12" y="417.5" font-size="12.5" font-weight="700" style="fill:#ebefed">Handoffs</text><g data-handoff-row="h-ask"><rect data-row="" x="8" y="424.5" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="434.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="437.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">1</text><text x="36" y="438.5" font-size="12" font-weight="700" style="fill:#ebefed">The owner → Lead</text><path d="M36,449 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="452.5" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="466" font-size="11" style="fill:#c0c7c4">what is wanted</text></g><g data-handoff-row="h-start"><rect data-row="" x="8" y="475" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="485" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#c0c7c4"/><text x="20" y="488.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">2</text><text x="36" y="489" font-size="12" font-weight="700" style="fill:#ebefed">Lead → Worker</text><path d="M36,499.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#c0c7c4"/><text x="60" y="503" font-size="11" font-weight="700" style="fill:#c0c7c4">session message</text><text x="36" y="516.5" font-size="11" style="fill:#c0c7c4">one piece</text></g><g data-handoff-row="h-back"><rect data-row="" x="8" y="525.5" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="535.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#5dbb94"/><text x="20" y="538.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">3</text><text x="36" y="539.5" font-size="12" font-weight="700" style="fill:#ebefed">Worker → Lead</text><path d="M36,550 h18" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#5dbb94"/><text x="60" y="553.5" font-size="11" font-weight="700" style="fill:#5dbb94">branch on example/app</text><text x="36" y="567" font-size="11" style="fill:#c0c7c4">the piece, on a branch</text></g><g data-handoff-row="h-wake"><rect data-row="" x="8" y="576" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="586" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/><text x="20" y="589.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">4</text><text x="36" y="590" font-size="12" font-weight="700" style="fill:#ebefed">Lead → itself</text><path d="M36,600.5 h18" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#a88be0"/><text x="60" y="604" font-size="11" font-weight="700" style="fill:#a88be0">scheduled message, every hour</text><text x="36" y="617.5" font-size="11" style="fill:#c0c7c4">its own check-in</text></g><g data-handoff-row="h-done"><rect data-row="" x="8" y="626.5" width="384" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="636.5" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#3cc0d0"/><text x="20" y="639.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">5</text><text x="36" y="640.5" font-size="12" font-weight="700" style="fill:#ebefed">Lead → The owner</text><path d="M36,651 h18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#3cc0d0"/><text x="60" y="654.5" font-size="11" font-weight="700" style="fill:#3cc0d0">notification, e-mail</text><text x="36" y="668" font-size="11" style="fill:#c0c7c4">done, with a link</text></g></svg>
