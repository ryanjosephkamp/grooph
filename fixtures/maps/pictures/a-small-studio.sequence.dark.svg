le="stroke:#a88be0"/><circle cx="250" cy="397" r="2.2" style="fill:#a88be0"/><path d="M250.5,409 l6.5,-3.6 v7.2 z" style="fill:#a88be0"/><circle cx="270" cy="403" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#a88be0"/><text x="270" y="406.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">6</text><text x="298" y="400" font-size="10.5" font-weight="700" style="fill:#a88be0">scheduled message, weekdays at 9:00</text><text x="298" y="413" font-size="10.5" style="fill:#c0c7c4">its check for new notes</text></g><g data-handoff="h-guide"><rect data-row="" x="8" y="423.5" width="564" height="35" rx="8" style="fill:transparent"/><path d="M250,441 H51.5" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#6fa3e0"/><circle cx="250" cy="441" r="2.2" style="fill:#6fa3e0"/><path d="M46.5,441 l6.5,-3.6 v7.2 z" style="fill:#6fa3e0"/><circle cx="231" cy="441" r="7.2" stroke-width="1.3" style="fill:#111514;stroke:#6fa3e0"/><text x="231" y="444.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#ebefed">7</text><text x="298" y="438" font-size="10.5" font-weight="700" style="fill:#6fa3e0">pull request on studio/app</text><text x="298" y="451" font-size="10.5" style="fill:#c0c7c4">the updated guide</text></g></svg>
