<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="sequence" viewBox="0 0 580 478" width="580" height="478" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A small studio</title><rect x="0" y="0" width="580" height="478" style="fill:#111514"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#ebefed">A small studio</text><text x="12" y="52" font-size="11" style="fill:#99a19e">3 lanes · 3 sessions · 1 person · 7 handoffs, 2 waiting on a</text><text x="12" y="65" font-size="11" style="fill:#99a19e">person</text><text x="12" y="79" font-size="11" style="fill:#c0c7c4">Read down: the order the map lists its handoffs in. An order, not</text><text x="12" y="93" font-size="11" style="fill:#c0c7c4">a clock: a map records no times.</text><text x="298" y="172.5" font-size="10" style="fill:#99a19e">Carried by, and what is handed</text><g data-people=""><rect x="13.5" y="105" width="65" height="361" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#242a27;stroke:#2d3331"/><text x="46" y="121" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">Person</text></g><g data-lane="laptop"><rect x="81.5" y="105" width="65" height="361" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="114" y="121" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">Laptop</text></g><g data-lane="laptop-b"><rect x="149.5" y="105" width="65" height="361" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="182" y="121" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">Laptop,</text><text x="182" y="133" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">second</text><text x="182" y="145" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">account</text></g><g data-lane="cloud"><rect x="217.5" y="105" width="65" height="361" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="250" y="121" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">Cloud</text></g><path d="M12,232 H568" stroke-width="1" style="stroke:#2d3331"/><path d="M12,270 H568" stroke-width="1" style="stroke:#2d3331"/><path d="M12,308 H568" stroke-width="1" style="stroke:#2d3331"/><path d="M12,346 H568" stroke-width="1" style="stroke:#2d3331"/><path d="M12,384 H568" stroke-width="1" style="stroke:#2d3331"/><path d="M12,422 H568" stroke-width="1" style="stroke:#2d3331"/><path d="M46,186 V460" stroke-width="1" style="stroke:#4a524f"/><path d="M114,186 V460" stroke-width="1" style="stroke:#4a524f"/><path d="M182,186 V460" stroke-width="1" style="stroke:#4a524f"/><path d="M250,186 V460" stroke-width="1" style="stroke:#4a524f"/><g data-person="maker"><rect data-card="" x="16" y="152" width="60" height="34" rx="12" stroke-width="1.4" style="fill:#362a15;stroke:#eb9a45"/><text x="46" y="166" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">The</text><text x="46" y="178.5" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">maker</text></g><g data-session="builder"><rect data-card="" x="84" y="152" width="60" height="34" rx="8" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="114" y="172.3" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">Builder</text></g><g data-session="reviewer"><rect data-card="" x="152" y="152" width="60" height="34" rx="8" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="182" y="172.3" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">Reviewer</text></g><g data-session="docs"><rect data-card="" x="220" y="152" width="60" height="34" rx="8" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><text x="250" y="166" font-size="10" font-weight="700" text-anchor="middle" style="fill:#ebefed">Docs</text><text x="250" y="178.5" font-size="10" font-weig