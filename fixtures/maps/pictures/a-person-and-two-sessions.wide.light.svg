<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="map" viewBox="0 0 340 694.5" width="340" height="694.5" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A person and two sessions</title><rect x="0" y="0" width="340" height="694.5" style="fill:#f1f4f3"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#1a201e">A person and two sessions</text><text x="12" y="52" font-size="11" style="fill:#5f6764">1 lane · 2 sessions · 1 person · 5 handoffs, 1 waiting</text><text x="12" y="65" font-size="11" style="fill:#5f6764">on a person</text><g data-people=""><rect x="12" y="77" width="316" height="86" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#e8edeb;stroke:#dce1df"/><text x="22" y="97" font-size="12.5" font-weight="700" style="fill:#1a201e">Person</text></g><g data-lane="laptop"><rect x="52" y="173" width="200" height="227" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="62" y="193" font-size="12.5" font-weight="700" style="fill:#1a201e">Laptop</text><rect x="207.8" y="182.2" width="36.2" height="14.7" rx="7.4" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="225.9" y="192.5" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">local</text><text x="62" y="206.5" font-size="10.5" style="fill:#5f6764">a laptop · one account</text></g><g data-person="owner"><rect data-card="" x="20" y="106.5" width="300" height="48.5" rx="14" stroke-width="1.4" style="fill:#fcf0d9;stroke:#b25e09"/><text x="30" y="127.5" font-size="13.5" font-weight="700" style="fill:#1a201e">The owner</text><text x="30" y="143" font-size="11" style="fill:#454c49">Asks for the work and reads the result</text></g><g data-session="lead"><rect data-card="" x="60" y="216" width="184" height="91.5" rx="9" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="70" y="237" font-size="13.5" font-weight="700" style="fill:#1a201e">Lead</text><text x="70" y="251" font-size="10.5" font-weight="700" style="fill:#1f5f4a">Claude Code</text><text x="70" y="266.5" font-size="11" style="fill:#454c49">Plans the work and checks it</text><text x="70" y="280.5" font-size="10" style="fill:#5f6764">long-lived</text><circle data-wakes="" cx="74.2" cy="292.1" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:#6b4fa0"/><text x="83" y="295.5" font-size="10" font-weight="700" style="fill:#6b4fa0">wakes itself · every hour</text></g><g data-session="worker"><rect data-card="" x="60" y="315.5" width="184" height="76.5" rx="9" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="70" y="336.5" font-size="13.5" font-weight="700" style="fill:#1a201e">Worker</text><text x="70" y="350.5" font-size="10.5" font-weight="700" style="fill:#1f5f4a">Claude Code</text><text x="70" y="366" font-size="11" style="fill:#454c49">Does one piece</text><text x="70" y="380" font-size="10" style="fill:#5f6764">per task</text></g><g data-plate="h-ask"><circle cx="43" cy="205.1" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/></g><g data-plate="h-start"><circle cx="274" cy="314.3" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/></g><g data-plate="h-back"><circle cx="287" cy="338.3" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#1f5f4a"/></g><g data-plate="h-done"><circle cx="30" cy="227.6" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#0f7c8c"/></g><g data-handoff="h-ask"><path d="M43,155 L43,197.9 M43,212.3 L43,249.3 Q43,255.3 49,255.3 L54.5,255.3" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><circle cx="43" cy="155" r="2.2" style="fill:#454c49"/><path d="M59.5,255.3 L53,251.7 L53,258.9 z" style="fill:#454c49"/></g><g data-handoff="h-start"><path d="M244,281.3 L268,281.3 Q274,281.3 274,287.3 L274,307.1 M274,321.5 L274,341.3 Q274,347.3 268,347.3 L249.5,347.3" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><circle cx="244" cy="281.3" r="2.2" style="fill:#454c49"/><path d="M244.5,347.3 L251,350.9 L251,343.7 z" style="fill:#454c49"/></g><g data-handoff="h-back"><path d="M244,360.3 L281,360.3 Q287,360.3 287,354.3 L287,345.5 M287,331.1 L287,274.3 Q287,268.3 281,268.3 L249.5,268.3" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#1f5f4a"/><circle cx="244" cy="360.3" r="2.2" style="fill:#1f5f4a"/><path d="M244.5,268.3 L251,271.9 L251,264.7 z" style="fill:#1f5f4a"/></g><g data-handoff="h-wake"><path d="M244,242.3 L255,242.3 Q261,242.3 261,248.3 L261,249.3 Q261,255.3 255,255.3 L249.5,255.3" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#6b4fa0"/><circle cx="244" cy="242.3" r="2.2" style="fill:#6b4fa0"/><path d="M244.5,255.3 L251,258.9 L251,251.7 z" style="fill:#6b4fa0"/></g><g data-plate="h-wake"><circle cx="261" cy="248.8" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#6b4fa0"/></g><g data-handoff="h-done"><path d="M60,268.3 L36,268.3 Q30,268.3 30,262.3 L30,234.8 M30,220.4 L30,160.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#0f7c8c"/><circle cx="60" cy="268.3" r="2.2" style="fill:#0f7c8c"/><path d="M30,155.5 L33.6,162 L26.4,162 z" style="fill:#0f7c8c"/></g><g data-number="h-ask"><text x="43" y="208.4" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">1</text></g><g data-number="h-start"><text x="274" y="317.6" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">2</text></g><g data-number="h-back"><text x="287" y="341.6" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">3</text></g><g data-number="h-wake"><text x="261" y="252.1" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">4</text></g><g data-number="h-done"><text x="30" y="230.9" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">5</text></g><text x="12" y="427" font-size="12.5" font-weight="700" style="fill:#1a201e">Handoffs</text><g data-handoff-row="h-ask"><rect data-row="" x="8" y="434" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="444" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/><text x="20" y="447.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">1</text><text x="36" y="448" font-size="12" font-weight="700" style="fill:#1a201e">The owner → Lead</text><path d="M36,458.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><text x="60" y="462" font-size="11" font-weight="700" style="fill:#454c49">session message</text><text x="36" y="475.5" font-size="11" style="fill:#454c49">what is wanted</text></g><g data-handoff-row="h-start"><rect data-row="" x="8" y="484.5" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="494.5" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/><text x="20" y="497.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">2</text><text x="36" y="498.5" font-size="12" font-weight="700" style="fill:#1a201e">Lead → Worker</text><path d="M36,509 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><text x="60" y="512.5" font-size="11" font-weight="700" style="fill:#454c49">session message</text><text x="36" y="526" font-size="11" style="fill:#454c49">one piece</text></g><g data-handoff-row="h-back"><rect data-row="" x="8" y="535" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="545" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#1f5f4a"/><text x="20" y="548.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">3</text><text x="36" y="549" font-size="12" font-weight="700" style="fill:#1a201e">Worker → Lead</text><path d="M36,559.5 h18" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#1f5f4a"/><text x="60" y="563" font-size="11" font-weight="700" style="fill:#1f5f4a">branch on example/app</text><text x="36" y="576.5" font-size="11" style="fill:#454c49">the piece, on a branch</text></g><g data-handoff-row="h-wake"><rect data-row="" x="8" y="585.5" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="595.5" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#6b4fa0"/><text x="20" y="598.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">4</text><text x="36" y="599.5" font-size="12" font-weight="700" style="fill:#1a201e">Lead → itself</text><path d="M36,610 h18" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#6b4fa0"/><text x="60" y="613.5" font-size="11" font-weight="700" style="fill:#6b4fa0">scheduled message, every hour</text><text x="36" y="627" font-size="11" style="fill:#454c49">its own check-in</text></g><g data-handoff-row="h-done"><rect data-row="" x="8" y="636" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="646" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#0f7c8c"/><text x="20" y="649.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">5</text><text x="36" y="650" font-size="12" font-weight="700" style="fill:#1a201e">Lead → The owner</text><path d="M36,660.5 h18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#0f7c8c"/><text x="60" y="664" font-size="11" font-weight="700" style="fill:#0f7c8c">notification, e-mail</text><text x="36" y="677.5" font-size="11" style="fill:#454c49">done, with a link</text></g></svg>
