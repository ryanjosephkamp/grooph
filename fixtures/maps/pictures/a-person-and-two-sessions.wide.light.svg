<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="map" viewBox="0 0 340 721" width="340" height="721" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>A person and two sessions</title><rect x="0" y="0" width="340" height="721" style="fill:#f1f4f3"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#1a201e">A person and two sessions</text><text x="12" y="52" font-size="11" style="fill:#5f6764">1 lane · 2 sessions · 1 person · 5 handoffs, 1 waiting</text><text x="12" y="65" font-size="11" style="fill:#5f6764">on a person</text><g data-people=""><rect x="12" y="77" width="316" height="86" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:#e8edeb;stroke:#dce1df"/><text x="22" y="97" font-size="12.5" font-weight="700" style="fill:#1a201e">Person</text></g><g data-lane="laptop"><rect x="71.5" y="173" width="184" height="253.5" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="81.5" y="193" font-size="12.5" font-weight="700" style="fill:#1a201e">Laptop</text><rect x="211.3" y="182.2" width="36.2" height="14.7" rx="7.4" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="229.4" y="192.5" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#454c49">local</text><text x="81.5" y="206.5" font-size="10.5" style="fill:#5f6764">a laptop · one account</text></g><g data-person="owner"><rect data-card="" x="20" y="106.5" width="300" height="48.5" rx="14" stroke-width="1.4" style="fill:#fcf0d9;stroke:#b25e09"/><text x="30" y="127.5" font-size="13.5" font-weight="700" style="fill:#1a201e">The owner</text><text x="30" y="143" font-size="11" style="fill:#454c49">Asks for the work and reads the result</text></g><g data-session="lead"><rect data-card="" x="79.5" y="216" width="168" height="118" rx="9" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="89.5" y="237" font-size="13.5" font-weight="700" style="fill:#1a201e">Lead</text><text x="89.5" y="251" font-size="10.5" font-weight="700" style="fill:#1f5f4a">Claude Code</text><text x="89.5" y="266.5" font-size="11" style="fill:#454c49">Plans the work and</text><text x="89.5" y="280" font-size="11" style="fill:#454c49">checks it</text><text x="89.5" y="294" font-size="10" style="fill:#5f6764">long-lived</text><circle data-wakes="" cx="93.7" cy="305.6" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:#6b4fa0"/><text x="102.5" y="309" font-size="10" font-weight="700" style="fill:#6b4fa0">wakes itself · every</text><text x="102.5" y="322" font-size="10" font-weight="700" style="fill:#6b4fa0">hour</text></g><g data-session="worker"><rect data-card="" x="79.5" y="342" width="168" height="76.5" rx="9" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><text x="89.5" y="363" font-size="13.5" font-weight="700" style="fill:#1a201e">Worker</text><text x="89.5" y="377" font-size="10.5" font-weight="700" style="fill:#1f5f4a">Claude Code</text><text x="89.5" y="392.5" font-size="11" style="fill:#454c49">Does one piece</text><text x="89.5" y="406.5" font-size="10" style="fill:#5f6764">per task</text></g><g data-plate="h-ask"><circle cx="62.5" cy="213" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/></g><g data-plate="h-start"><circle cx="277.5" cy="331.6" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/></g><g data-plate="h-back"><circle cx="290.5" cy="355.6" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#1f5f4a"/></g><g data-plate="h-done"><circle cx="49.5" cy="235.5" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#0f7c8c"/></g><g data-handoff="h-ask"><path d="M62.5,155 L62.5,205.8 M62.5,220.2 L62.5,265 Q62.5,271 68.5,271 L74,271" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><circle cx="62.5" cy="155" r="2.2" style="fill:#454c49"/><path d="M79,271 L72.5,267.4 L72.5,274.6 z" style="fill:#454c49"/></g><g data-handoff="h-start"><path d="M247.5,292 L271.5,292 Q277.5,292 277.5,298 L277.5,324.4 M277.5,338.8 L277.5,365.3 Q277.5,371.3 271.5,371.3 L253,371.3" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><circle cx="247.5" cy="292" r="2.2" style="fill:#454c49"/><path d="M248,371.3 L254.5,374.9 L254.5,367.7 z" style="fill:#454c49"/></g><g data-handoff="h-back"><path d="M247.5,384.3 L284.5,384.3 Q290.5,384.3 290.5,378.3 L290.5,362.8 M290.5,348.4 L290.5,285 Q290.5,279 284.5,279 L253,279" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#1f5f4a"/><circle cx="247.5" cy="384.3" r="2.2" style="fill:#1f5f4a"/><path d="M248,279 L254.5,282.6 L254.5,275.4 z" style="fill:#1f5f4a"/></g><g data-handoff="h-wake"><path d="M247.5,253 L258.5,253 Q264.5,253 264.5,259 L264.5,260 Q264.5,266 258.5,266 L253,266" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#6b4fa0"/><circle cx="247.5" cy="253" r="2.2" style="fill:#6b4fa0"/><path d="M248,266 L254.5,269.6 L254.5,262.4 z" style="fill:#6b4fa0"/></g><g data-plate="h-wake"><circle cx="264.5" cy="259.5" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#6b4fa0"/></g><g data-handoff="h-done"><path d="M79.5,284 L55.5,284 Q49.5,284 49.5,278 L49.5,242.7 M49.5,228.3 L49.5,160.5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#0f7c8c"/><circle cx="79.5" cy="284" r="2.2" style="fill:#0f7c8c"/><path d="M49.5,155.5 L53.1,162 L45.9,162 z" style="fill:#0f7c8c"/></g><g data-number="h-ask"><text x="62.5" y="216.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">1</text></g><g data-number="h-start"><text x="277.5" y="334.9" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">2</text></g><g data-number="h-back"><text x="290.5" y="358.9" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">3</text></g><g data-number="h-wake"><text x="264.5" y="262.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">4</text></g><g data-number="h-done"><text x="49.5" y="238.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">5</text></g><text x="12" y="453.5" font-size="12.5" font-weight="700" style="fill:#1a201e">Handoffs</text><g data-handoff-row="h-ask"><rect data-row="" x="8" y="460.5" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="470.5" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/><text x="20" y="473.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">1</text><text x="36" y="474.5" font-size="12" font-weight="700" style="fill:#1a201e">The owner → Lead</text><path d="M36,485 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><text x="60" y="488.5" font-size="11" font-weight="700" style="fill:#454c49">session message</text><text x="36" y="502" font-size="11" style="fill:#454c49">what is wanted</text></g><g data-handoff-row="h-start"><rect data-row="" x="8" y="511" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="521" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#454c49"/><text x="20" y="524.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">2</text><text x="36" y="525" font-size="12" font-weight="700" style="fill:#1a201e">Lead → Worker</text><path d="M36,535.5 h18" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#454c49"/><text x="60" y="539" font-size="11" font-weight="700" style="fill:#454c49">session message</text><text x="36" y="552.5" font-size="11" style="fill:#454c49">one piece</text></g><g data-handoff-row="h-back"><rect data-row="" x="8" y="561.5" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="571.5" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#1f5f4a"/><text x="20" y="574.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">3</text><text x="36" y="575.5" font-size="12" font-weight="700" style="fill:#1a201e">Worker → Lead</text><path d="M36,586 h18" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:#1f5f4a"/><text x="60" y="589.5" font-size="11" font-weight="700" style="fill:#1f5f4a">branch on example/app</text><text x="36" y="603" font-size="11" style="fill:#454c49">the piece, on a branch</text></g><g data-handoff-row="h-wake"><rect data-row="" x="8" y="612" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="622" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#6b4fa0"/><text x="20" y="625.3" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">4</text><text x="36" y="626" font-size="12" font-weight="700" style="fill:#1a201e">Lead → itself</text><path d="M36,636.5 h18" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3" style="stroke:#6b4fa0"/><text x="60" y="640" font-size="11" font-weight="700" style="fill:#6b4fa0">scheduled message, every hour</text><text x="36" y="653.5" font-size="11" style="fill:#454c49">its own check-in</text></g><g data-handoff-row="h-done"><rect data-row="" x="8" y="662.5" width="324" height="47.5" rx="8" style="fill:transparent"/><circle cx="20" cy="672.5" r="7.2" stroke-width="1.3" style="fill:#f1f4f3;stroke:#0f7c8c"/><text x="20" y="675.8" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#1a201e">5</text><text x="36" y="676.5" font-size="12" font-weight="700" style="fill:#1a201e">Lead → The owner</text><path d="M36,687 h18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 4.5" style="stroke:#0f7c8c"/><text x="60" y="690.5" font-size="11" font-weight="700" style="fill:#0f7c8c">notification, e-mail</text><text x="36" y="704" font-size="11" style="fill:#454c49">done, with a link</text></g></svg>
