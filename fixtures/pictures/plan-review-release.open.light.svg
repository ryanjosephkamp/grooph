<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" viewBox="0 0 400 802" width="400" height="802" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Plan, review, release</title><rect x="0" y="0" width="400" height="802" style="fill:#f1f4f3"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#1a201e">Plan, review, release</text><text x="12" y="52" font-size="11" style="fill:#5f6764">claude-code · 4 agents · 1 gate · 1 loop · up to 4 rounds · 10</text><text x="12" y="65" font-size="11" style="fill:#5f6764">dispatches</text><text x="12" y="84.5" font-size="11.5" style="fill:#454c49">Ship the checkout flow behind a review gate.</text><g data-group="review" data-open=""><rect x="7" y="192" width="345" height="262.5" rx="12" stroke-width="1" stroke-dasharray="5 4" style="fill:none;stroke:#b9c1be"/><text x="15" y="205" font-size="9.5" font-weight="700" style="fill:#5f6764">Review gate</text><text x="344" y="205" font-size="9.5" text-anchor="end" style="fill:#5f6764">review-gate@1</text></g><g data-edge="e-plan-review-builder"><path d="M179.5,158 V206.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#454c49"/><path d="M179.5,211.5 l-3.6,-6.5 h7.2 z" style="fill:#454c49"/></g><g data-edge="e-release-done"><path d="M179.5,550 V574.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#454c49"/><path d="M179.5,579.5 l-3.6,-6.5 h7.2 z" style="fill:#454c49"/></g><g data-edge="e-review-builder-review-critic"><path d="M179.5,271.5 V296" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#454c49"/><path d="M179.5,301 l-3.6,-6.5 h7.2 z" style="fill:#454c49"/></g><g data-edge="review-e-critic-pass"><path d="M179.5,361 V385.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#454c49"/><path d="M179.5,390.5 l-3.6,-6.5 h7.2 z" style="fill:#454c49"/></g><g data-edge="e-review-merge-gate-release"><path d=