e:#b9c1be"/><circle cx="25.5" cy="316.1" r="3.5" style="fill:#1f5f4a"/><text x="33" y="319.5" font-size="9.5" font-weight="700" style="fill:#1f5f4a">Agent</text><circle cx="333.5" cy="316.1" r="3.5" style="fill:#7a4cc2"/><text x="22" y="339" font-size="13.5" font-weight="700" style="fill:#1a201e">Critic</text><text x="22" y="352" font-size="10.5" style="fill:#454c49">critic · strong · high</text></g><g data-node="review-merge-gate"><rect data-card="" x="12" y="391" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:#fdfefe;stroke:#b25e09"/><circle cx="25.5" cy="405.6" r="3.5" style="fill:#b25e09"/><text x="33" y="409" font-size="9.5" font-weight="700" style="fill:#b25e09">Human gate</text><circle cx="333.5" cy="405.6" r="3.5" style="fill:#7a4cc2"/><text x="22" y="428.5" font-size="13.5" font-weight="700" style="fill:#1a201e">Merge approval</text><text x="22" y="441.5" font-size="10.5" style="fill:#454c49">approve / reject with feedback</text></g><g data-node="release"><rect data-card="" x="12" y="490.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><circle cx="25.5" cy="505.1" r="3.5" style="fill:#1f5f4a"/><text x="33" y="508.5" font-size="9.5" font-weight="700" style="fill:#1f5f4a">Agent</text><text x="22" y="528" font-size="13.5" font-weight="700" style="fill:#1a201e">Release</text><text x="22" y="541" font-size="10.5" style="fill:#454c49">builder</text></g><g data-node="done"><rect data-card="" x="12" y="580" width="335" height="59.5" rx="16" stroke-width="1" style="fill:#fdfefe;stroke:#b9c1be"/><circle cx="25.5" cy="594.6" r="3.5" style="fill:#5b5f66"/><text x="33" y="598" font-size="9.5" font-weight="700" style="fill:#5b5f66">Stop</text><text x="22" y="617.5" font-size="13.5" font-weight="700" style="fill:#1a201e">Done</text><text x="22" y="630.5" font-size="10.5" style="fill:#454c49">success</text></g><rect x="161.8" y="368.9" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:#f1f4f3;stroke:#