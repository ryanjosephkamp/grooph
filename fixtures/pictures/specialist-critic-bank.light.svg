<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" viewBox="0 0 400 913" width="400" height="913" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Specialist critic bank</title><rect x="0" y="0" width="400" height="913" style="fill:#f1f4f3"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#1a201e">Specialist critic bank</text><text x="12" y="52" font-size="11" style="fill:#5f6764">claude-code · 6 agents · 1 gate · 1 loop · up to 4 rounds · 26 dispatches</text><text x="12" y="71.5" font-size="11.5" style="fill:#454c49">{{task}} Done when the merged review lists no blocker and no major</text><text x="12" y="86" font-size="11.5" style="fill:#454c49">finding, `{{test-command}}` passes, and a human accepts the</text><text x="12" y="100.5" font-size="11.5" style="fill:#454c49">change.</text><rect x="92" y="200" width="255" height="288" rx="12" stroke-width="1" style="fill:#e8edeb;stroke:#dce1df"/><text x="100" y="213" font-size="9.5" font-weight="700" style="fill:#5f6764">4 side by side</text><g data-edge="e-builder-correctness"><path d="M219.5,174 V214.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#454c49"/><path d="M219.5,219.5 l-3.6,-6.5 h7.2 z" style="fill:#454c49"/></g><g data-edge="e-taste-triage"><path d="M219.5,482 V506.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#454c49"/><path d="M219.5,511.5 l-3.6,-6.5 h7.2 z" style="fill:#454c49"/></g><g data-edge="e-triage-gate"><path d="M219.5,571.5 V596" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#454c49"/><path d="M219.5,601 l-3.6,-6.5 h7.2 z" style="fill:#454c49"/></g><g data-edge="e-gate-done"><path d="M219.5,661 V685.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#454c49"/><path d="M219.5,690.5 l-3.6,-6.5 h7.2 z" style="fill:#454c49"/></g><g data-edge="e-builder-security"><path d="M98,132.3 H88 Q82,132.3 82,