00" style="fill:#1a201e">Review</text><text x="28" y="814" font-size="11" style="fill:#5f6764">judgment loop · Builder, Correctness critic, Security critic,</text><text x="28" y="827.5" font-size="11" style="fill:#5f6764">Performance critic, Taste critic, Triage judge, Accept the change</text><text x="28" y="841" font-size="11" style="fill:#454c49">Bar: Merged severity list. TRIAGE.md lists no blocker and no major</text><text x="28" y="854.5" font-size="11" style="fill:#454c49">finding, and `{{test-command}}` exits 0.</text><text x="28" y="868" font-size="11" style="fill:#454c49">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="881.5" font-size="11" style="fill:#454c49">2. max iterations: 4: halt the run and report to the human</text><text x="28" y="895" font-size="11" style="fill:#454c49">3. budget: 26 dispatches: halt the run and report to the human</text></g></svg>
