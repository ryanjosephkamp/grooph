<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" viewBox="0 0 400 577" width="400" height="577" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Review loop</title><rect x="0" y="0" width="400" height="577" style="fill:#111514"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#ebefed">Review loop</text><text x="12" y="52" font-size="11" style="fill:#99a19e">claude-code · 2 agents · 1 gate · 1 loop · up to 4 rounds · 40 turns</text><text x="12" y="71.5" font-size="11.5" style="fill:#c0c7c4">Implement the change described in TASK.md so that every item in the</text><text x="12" y="86" font-size="11.5" style="fill:#c0c7c4">review checklist is satisfied and the test command passes.</text><g data-edge="e-build-review"><path d="M179.5,159.5 V184" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#c0c7c4"/><path d="M179.5,189 l-3.6,-6.5 h7.2 z" style="fill:#c0c7c4"/></g><g data-edge="e-review-pass"><path d="M179.5,249 V273.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#c0c7c4"/><path d="M179.5,278.5 l-3.6,-6.5 h7.2 z" style="fill:#c0c7c4"/></g><g data-edge="e-gate-approve"><path d="M179.5,338.5 V363" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#c0c7c4"/><path d="M179.5,368 l-3.6,-6.5 h7.2 z" style="fill:#c0c7c4"/></g><g data-edge="e-review-fail"><path d="M347,219.3 H357 Q363,219.3 363,213.3 V129.8 Q363,123.8 357,123.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#a883f0"/><circle cx="347" cy="219.3" r="2.2" style="fill:#a883f0"/><path d="M347.5,123.8 l6.5,-3.6 v7.2 z" style="fill:#a883f0"/></g><g data-edge="e-gate-reject"><path d="M347,308.8 H370 Q376,308.8 376,302.8 V141.8 Q376,135.8 370,135.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:#a883f0"/><circle cx="347" cy="308.8" r="2.2" style="fill:#a883f0"/><path d="M347.5,135.8 l6.5,-3.6 v7.2 z" style="fill:#a883f0"/></g><g data-node="builder"><rect data-card="" x="12" y="100" width="335" height="59.5" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><circle cx="25.5" cy="114.6" r="3.5" style="fill:#5dbb94"/><text x="33" y="118" font-size="9.5" font-weight="700" style="fill:#5dbb94">Agent</text><circle cx="333.5" cy="114.6" r="3.5" style="fill:#a883f0"/><text x="22" y="137.5" font-size="13.5" font-weight="700" style="fill:#ebefed">Builder</text><text x="22" y="150.5" font-size="10.5" style="fill:#c0c7c4">builder · strong · high</text></g><g data-node="critic"><rect data-card="" x="12" y="189.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><circle cx="25.5" cy="204.1" r="3.5" style="fill:#5dbb94"/><text x="33" y="207.5" font-size="9.5" font-weight="700" style="fill:#5dbb94">Agent</text><circle cx="333.5" cy="204.1" r="3.5" style="fill:#a883f0"/><text x="22" y="227" font-size="13.5" font-weight="700" style="fill:#ebefed">Critic</text><text x="22" y="240" font-size="10.5" style="fill:#c0c7c4">critic · strong · high</text></g><g data-node="merge-gate"><rect data-card="" x="12" y="279" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:#1b201e;stroke:#eb9a45"/><circle cx="25.5" cy="293.6" r="3.5" style="fill:#eb9a45"/><text x="33" y="297" font-size="9.5" font-weight="700" style="fill:#eb9a45">Human gate</text><circle cx="333.5" cy="293.6" r="3.5" style="fill:#a883f0"/><text x="22" y="316.5" font-size="13.5" font-weight="700" style="fill:#ebefed">Merge approval</text><text x="22" y="329.5" font-size="10.5" style="fill:#c0c7c4">approve / reject with feedback</text></g><g data-node="done"><rect data-card="" x="12" y="368.5" width="335" height="59.5" rx="16" stroke-width="1" style="fill:#1b201e;stroke:#4a524f"/><circle cx="25.5" cy="383.1" r="3.5" style="fill:#9ba0a8"/><text x="33" y="386.5" font-size="9.5" font-weight="700" style="fill:#9ba0a8">Stop</text><text x="22" y="406" font-size="13.5" font-weight="700" style="fill:#ebefed">Done</text><text x="22" y="419" font-size="10.5" style="fill:#c0c7c4">success</text></g><rect x="163.2" y="256.9" width="32.6" height="14.7" rx="7.4" stroke-width="1" style="fill:#111514;stroke:#c0c7c4"/><text x="179.5" y="267.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">pass</text><rect x="163.2" y="346.4" width="32.6" height="14.7" rx="7.4" stroke-width="1" style="fill:#111514;stroke:#c0c7c4"/><text x="179.5" y="356.7" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:#c0c7c4">pass</text><g transform="rotate(-90 363 171.5)"><rect x="351.4" y="165" width="23.2" height="13" rx="6.5" stroke-width="1" style="fill:#111514;stroke:#a883f0"/><text x="363" y="174.7" font-size="9" font-weight="700" text-anchor="middle" style="fill:#a883f0">fail</text></g><g transform="rotate(-90 376 222.3)"><rect x="364.4" y="215.8" width="23.2" height="13" rx="6.5" stroke-width="1" style="fill:#111514;stroke:#a883f0"/><text x="376" y="225.5" font-size="9" font-weight="700" text-anchor="middle" style="fill:#a883f0">fail</text></g><text x="12" y="457" font-size="12.5" font-weight="700" style="fill:#ebefed">Loop</text><g data-loop="review-cycle"><circle cx="17" cy="474" r="4.5" style="fill:#a883f0"/><text x="28" y="478" font-size="12" font-weight="700" style="fill:#ebefed">Build-review cycle</text><text x="28" y="491.5" font-size="11" style="fill:#99a19e">judgment loop · Builder, Critic, Merge approval</text><text x="28" y="505" font-size="11" style="fill:#c0c7c4">Bar: Review checklist. Every checklist item is cited as satisfied with</text><text x="28" y="518.5" font-size="11" style="fill:#c0c7c4">a file and line, and the test command exits 0.</text><text x="28" y="532" font-size="11" style="fill:#c0c7c4">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="545.5" font-size="11" style="fill:#c0c7c4">2. max iterations: 4: halt the run and report to the human</text><text x="28" y="559" font-size="11" style="fill:#c0c7c4">3. budget: 40 turns: halt the run and report to the human</text></g></svg>
