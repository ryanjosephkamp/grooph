<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" viewBox="0 0 400 939.5" width="400" height="939.5" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Specialist critic bank</title><rect x="0" y="0" width="400" height="939.5" style="fill:#111514"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:#ebefed">Specialist critic bank</text><text x="12" y="52" font-size="11" style="fill:#99a19e">claude-code · 6 agents · 1 gate · 1 loop · up to 4 rounds · 26</text><text x="12" y="65" font-size="11" style="fill:#99a19e">dispatches</text><text x="12" y="84.5" font-size="11.5" style="fill:#c0c7c4">{{task}} Done when the merged review lists no blocker and</text><text x="12" y="99" font-size="11.5" style="fill:#c0c7c4">no major finding, `{{test-command}}` passes, and a human</text><text x="12" y="113.5" font-size="11.5" style="fill:#c0c7c4">accepts the change.</text><rect x="92" y="213" width="255" height="288" rx="12" stroke-width="1" style="fill:#242a27;stroke:#2d3331"/><text x="100" y="226" font-size="9.5" font-weight="700" style="fill:#99a19e">4 side by side</text><g data-edge="e-builder-correctness"><path d="M219.5,187 V227.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#c0c7c4"/><path d="M219.5,232.5 l-3.6,-6.5 h7.2 z" style="fill:#c0c7c4"/></g><g data-edge="e-taste-triage"><path d="M219.5,495 V519.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#c0c7c4"/><path d="M219.5,524.5 l-3.6,-6.5 h7.2 z" style="fill:#c0c7c4"/></g><g data-edge="e-triage-gate"><path d="M219.5,584.5 V609" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#c0c7c4"/><path d="M219.5,614 l-3.6,-6.5 h7.2 z" style="fill:#c0c7c4"/></g><g data-edge="e-gate-done"><path d="M219.5,674 V698.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:#c0c7c4"/><path d="M219.5,703.5 l-3.6,-6.5 h7.2 z" style="fill:#c0c7c4"/></g><g