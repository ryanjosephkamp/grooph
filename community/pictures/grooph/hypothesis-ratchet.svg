<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" viewBox="0 0 400 556" width="400" height="556" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Hypothesis ratchet (example values)</title><style>.grooph-picture{--gp-bg:#f1f4f3;--gp-surface:#fdfefe;--gp-surface-2:#e8edeb;--gp-ink:#1a201e;--gp-ink-2:#454c49;--gp-ink-3:#5f6764;--gp-line:#dce1df;--gp-line-strong:#b9c1be;--gp-accent:#1f5f4a;--gp-accent-soft:#dcefe6;--gp-gate:#b25e09;--gp-gate-soft:#fcf0d9;--gp-check:#2b5f9e;--gp-merge:#6b4fa0;--gp-stop:#5b5f66;--gp-ok:#1f7a4d;--gp-ok-soft:#dff3e6;--gp-warning:#955500;--gp-error:#b42318;--gp-error-soft:#fceae7;--gp-loop-0:#7a4cc2;--gp-loop-1:#0f7c8c;--gp-loop-2:#c2410c;--gp-loop-3:#b5306e}@media (prefers-color-scheme:dark){.grooph-picture:not([data-theme="light"]){--gp-bg:#111514;--gp-surface:#1b201e;--gp-surface-2:#242a27;--gp-ink:#ebefed;--gp-ink-2:#c0c7c4;--gp-ink-3:#99a19e;--gp-line:#2d3331;--gp-line-strong:#4a524f;--gp-accent:#5dbb94;--gp-accent-soft:#1e3a30;--gp-gate:#eb9a45;--gp-gate-soft:#362a15;--gp-check:#6fa3e0;--gp-merge:#a88be0;--gp-stop:#9ba0a8;--gp-ok:#6fcf9d;--gp-ok-soft:#1c3a2a;--gp-warning:#f0b35a;--gp-error:#ff8f80;--gp-error-soft:#3a1e1b;--gp-loop-0:#a883f0;--gp-loop-1:#3cc0d0;--gp-loop-2:#f0874f;--gp-loop-3:#ee6fa6}}.grooph-picture[data-theme="dark"]{--gp-bg:#111514;--gp-surface:#1b201e;--gp-surface-2:#242a27;--gp-ink:#ebefed;--gp-ink-2:#c0c7c4;--gp-ink-3:#99a19e;--gp-line:#2d3331;--gp-line-strong:#4a524f;--gp-accent:#5dbb94;--gp-accent-soft:#1e3a30;--gp-gate:#eb9a45;--gp-gate-soft:#362a15;--gp-check:#6fa3e0;--gp-merge:#a88be0;--gp-stop:#9ba0a8;--gp-ok:#6fcf9d;--gp-ok-soft:#1c3a2a;--gp-warning:#f0b35a;--gp-error:#ff8f80;--gp-error-soft:#3a1e1b;--gp-loop-0:#a883f0;--gp-loop-1:#3cc0d0;--gp-loop-2:#f0874f;--gp-loop-3:#ee6fa6}</style><rect x="0" y="0" width="400" height="556" style="fill:var(--gp-bg)"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:var(--gp-ink)">Hypothesis ratchet (example values)</text><text x="12" y="52" font-size="11" style="fill:var(--gp-ink-3)">claude-code · 2 agents · 1 loop · up to 5 rounds · 12 dispatches</text><text x="12" y="71.5" font-size="11.5" style="fill:var(--gp-ink-2)">Raise the pass rate of the ticket-triage prompt in</text><text x="12" y="86" font-size="11.5" style="fill:var(--gp-ink-2)">prompts/triage.md on the sorting task. Done when the kept</text><text x="12" y="100.5" font-size="11.5" style="fill:var(--gp-ink-2)">result reaches a pass rate of 0.90 on cases the proposer nev…</text><g data-edge="e-proposer-judge"><path d="M186,174 V198.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M186,203.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-judge-pass"><path d="M186,263.5 V288" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M186,293 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-judge-fail"><path d="M360,233.8 H370 Q376,233.8 376,227.8 V150.3 Q376,144.3 370,144.3 H365.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="360" cy="233.8" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M360.5,144.3 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-node="proposer"><rect data-card="" x="12" y="114.5" width="348" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="129.1" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="132.5" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="346.5" cy="129.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="152" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Proposer</text><text x="22" y="165" font-size="10.5" style="fill:var(--gp-ink-2)">builder · strong · high</text></g><g data-node="judge"><rect data-card="" x="12" y="204" width="348" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="218.6" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="222" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="346.5" cy="218.6" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="241.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Held-out judge</text><text x="22" y="254.5" font-size="10.5" style="fill:var(--gp-ink-2)">judge · fast · medium</text></g><g data-node="done"><rect data-card="" x="12" y="293.5" width="348" height="59.5" rx="16" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="308.1" r="3.5" style="fill:var(--gp-stop)"/><text x="33" y="311.5" font-size="9.5" font-weight="700" style="fill:var(--gp-stop)">Stop</text><text x="22" y="331" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Done</text><text x="22" y="344" font-size="10.5" style="fill:var(--gp-ink-2)">success</text></g><rect x="168.3" y="271.4" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="186" y="281.7" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><g transform="rotate(-90 376 189)"><rect x="363.3" y="182.5" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-0)"/><text x="376" y="192.2" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-0)">fail</text></g><text x="12" y="382" font-size="12.5" font-weight="700" style="fill:var(--gp-ink)">Loop</text><g data-loop="ratchet"><circle cx="17" cy="399" r="4.5" style="fill:var(--gp-loop-0)"/><text x="28" y="403" font-size="12" font-weight="700" style="fill:var(--gp-ink)">Ratchet</text><text x="28" y="416.5" font-size="11" style="fill:var(--gp-ink-3)">judgment loop · Proposer, Held-out judge</text><text x="28" y="430" font-size="11" style="fill:var(--gp-ink-2)">Bar: Held-out score. The kept result reaches a pass rate of</text><text x="28" y="443.5" font-size="11" style="fill:var(--gp-ink-2)">0.90 on the held-out cases, as the judge's own run of `node</text><text x="28" y="457" font-size="11" style="fill:var(--gp-ink-2)">eval/run-heldout.js prompts/triage.md` shows.</text><text x="28" y="470.5" font-size="11" style="fill:var(--gp-ink-2)">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="484" font-size="11" style="fill:var(--gp-ink-2)">2. diminishing returns over 2 round(s) on rounds that keep a</text><text x="28" y="497.5" font-size="11" style="fill:var(--gp-ink-2)">new best: continue at node done</text><text x="28" y="511" font-size="11" style="fill:var(--gp-ink-2)">3. max iterations: 5: halt the run and report to the human</text><text x="28" y="524.5" font-size="11" style="fill:var(--gp-ink-2)">4. budget: 12 dispatches: halt the run and report to the</text><text x="28" y="538" font-size="11" style="fill:var(--gp-ink-2)">human</text></g></svg>

