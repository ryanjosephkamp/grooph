ta-wakes="" cx="34.2" cy="279.1" r="3.6" fill="none" stroke-width="1.8" stroke-dasharray="1.5 2.2" style="stroke:var(--gp-merge)"/><text x="43" y="282.5" font-size="10" font-weight="700" style="fill:var(--gp-merge)">wakes itself · every hour</text></g><g data-session="worker"><rect data-card="" x="20" y="306" width="317" height="76.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><text x="30" y="327" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Worker</text><text x="30" y="341" font-size="10.5" font-weight="700" style="fill:var(--gp-accent)">Claude Code</text><text x="30" y="356.5" font-size="11" style="fill:var(--gp-ink-2)">Does one piece</text><text x="30" y="370.5" font-size="10" style="fill:var(--gp-ink-3)">per task</text></g><g data-plate="h-ask"><circle cx="353" cy="164.6" r="7.2" stroke-width="1.3" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/></g><g data-plate="h-start"><circle cx="353" cy="303.9" r="7.2" stroke-width="1.3" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/></g><g data-plate="h-back"><circle cx="366" cy="324.9" r="7.2" stroke-width="1.3" style="fill:var(--gp-bg);stroke:var(--gp-accent)"/></g><g data-plate="h-done"><circle cx="366" cy="185.6" r="7.2" stroke-width="1.3" style="fill:var(--gp-bg);stroke:var(--gp-loop-1)"/></g><g data-handoff="h-ask"><path d="M337,111.3 H347 Q353,111.3 353,117.3 V157.4 M353,171.8 V212 Q353,218 347,218 H342.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-ink-2)"/><circle cx="337" cy="111.3" r="2.2" style="fill:var(--gp-ink-2)"/><path d="M337.5,218 l6.5,-3.6 v7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-handoff="h-start"><path d="M337,270 H347 Q353,270 353,276 V296.7 M353,311.1 V331.8 Q353,337.8 347,337.8 H342.5" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-ink-2)"/><circle cx="337" cy="270" r="2.2" style="fill:var(--gp-ink-2)"/><path d="M337.5,