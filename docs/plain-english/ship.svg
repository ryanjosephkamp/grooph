e="fill:var(--gp-ink-2)">A builder works, an isolated critic checks the change against a</text><text x="22" y="251.5" font-size="10.5" style="fill:var(--gp-ink-2)">written checklist, failures loop back, and a human approves th…</text></g><g data-node="released"><rect data-card="" x="12" y="330.5" width="376" height="59.5" rx="16" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="345.1" r="3.5" style="fill:var(--gp-stop)"/><text x="33" y="348.5" font-size="9.5" font-weight="700" style="fill:var(--gp-stop)">Stop</text><text x="22" y="368" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Released</text><text x="22" y="381" font-size="10.5" style="fill:var(--gp-ink-2)">ends the run</text></g><svg x="22" y="258.5" width="77.2" height="34" viewBox="-23 -26 168 74" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-19" y="-22" width="160" height="66" rx="10" stroke-width="1.3" stroke-dasharray="4 3" style="stroke:var(--gp-loop-0)"/>
