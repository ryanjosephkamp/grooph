<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" data-look="chalk" viewBox="0 0 400 604.5" width="400" height="604.5" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Review loop</title><style>.grooph-picture[data-look="chalk"]{--gp-bg:#f6f7f7;--gp-surface:#fbfbfb;--gp-surface-2:#eceeee;--gp-ink:#2a2e32;--gp-ink-2:#454a50;--gp-ink-3:#62686f;--gp-line:#d5d8db;--gp-line-strong:#4a5057;--gp-accent:#2456a6;--gp-accent-soft:#dfe8f6;--gp-gate:#a94e08;--gp-gate-soft:#fbeedd;--gp-check:#2456a6;--gp-merge:#6a45b5;--gp-stop:#62686f;--gp-ok:#1c6b4a;--gp-ok-soft:#dcf0e6;--gp-warning:#8a5200;--gp-error:#a8261c;--gp-error-soft:#fbe6e3;--gp-loop-0:#7a3fb8;--gp-loop-1:#0e7584;--gp-loop-2:#b8430f;--gp-loop-3:#a82a66}@media (prefers-color-scheme:dark){.grooph-picture[data-look="chalk"]:not([data-theme="light"]){--gp-bg:#26302e;--gp-surface:#2a3533;--gp-surface-2:#313d3a;--gp-ink:#f3f2ec;--gp-ink-2:#d9dcd5;--gp-ink-3:#b0b8b1;--gp-line:#3d4a47;--gp-line-strong:#d9dcd5;--gp-accent:#a8d8ff;--gp-accent-soft:#2f4652;--gp-gate:#ffd28a;--gp-gate-soft:#4a4230;--gp-check:#a8d8ff;--gp-merge:#d9c2ff;--gp-stop:#b0b8b1;--gp-ok:#a6e8c0;--gp-ok-soft:#2c4a3c;--gp-warning:#ffd28a;--gp-error:#ffb0a6;--gp-error-soft:#4f3532;--gp-loop-0:#f5a8cc;--gp-loop-1:#9fe0d6;--gp-loop-2:#ffb48a;--gp-loop-3:#d9c2ff}}.grooph-picture[data-look="chalk"][data-theme="dark"]{--gp-bg:#26302e;--gp-surface:#2a3533;--gp-surface-2:#313d3a;--gp-ink:#f3f2ec;--gp-ink-2:#d9dcd5;--gp-ink-3:#b0b8b1;--gp-line:#3d4a47;--gp-line-strong:#d9dcd5;--gp-accent:#a8d8ff;--gp-accent-soft:#2f4652;--gp-gate:#ffd28a;--gp-gate-soft:#4a4230;--gp-check:#a8d8ff;--gp-merge:#d9c2ff;--gp-stop:#b0b8b1;--gp-ok:#a6e8c0;--gp-ok-soft:#2c4a3c;--gp-warning:#ffd28a;--gp-error:#ffb0a6;--gp-error-soft:#4f3532;--gp-loop-0:#f5a8cc;--gp-loop-1:#9fe0d6;--gp-loop-2:#ffb48a;--gp-loop-3:#d9c2ff}.grooph-picture[data-look="chalk"]{font-family:"Chalkboard SE","Comic Sans MS","Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.grooph-picture[data-look="chalk"] rect[data-card],.grooph-picture[data-look="chalk"] [data-edge],.grooph-picture[data-look="chalk"] [data-plate],.grooph-picture[data-look="chalk"] [data-lane]>rect,.grooph-picture[data-look="chalk"] [data-people]>rect,.grooph-picture[data-look="chalk"][data-picture="map"] [data-handoff]{filter:url(#gp-chalk)}.grooph-picture[data-look="chalk"] rect[data-card]{stroke-width:1.5}.grooph-picture[data-look="chalk"] rect[data-card][stroke-width="1.8"]{stroke-width:2.6}.grooph-picture[data-look="chalk"] [data-edge] path[fill="none"]{stroke-width:1.8}.grooph-picture[data-look="chalk"] text{letter-spacing:.01em}</style><defs><filter id="gp-chalk"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect x="0" y="0" width="400" height="604.5" style="fill:var(--gp-bg)"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:var(--gp-ink)">Review loop</text><text x="12" y="52" font-size="11" style="fill:var(--gp-ink-3)">claude-code · 2 agents · 1 gate · 1 loop · up to 4 rounds · 40</text><text x="12" y="65" font-size="11" style="fill:var(--gp-ink-3)">turns</text><text x="12" y="84.5" font-size="11.5" style="fill:var(--gp-ink-2)">Implement the change described in TASK.md so that every</text><text x="12" y="99" font-size="11.5" style="fill:var(--gp-ink-2)">item in the review checklist is satisfied and the test command</text><text x="12" y="113.5" font-size="11.5" style="fill:var(--gp-ink-2)">passes.</text><g data-edge="e-build-review"><path d="M179.5,187 V211.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,216.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-review-pass"><path d="M179.5,276.5 V301" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,306 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-gate-approve"><path d="M179.5,366 V390.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,395.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-review-fail"><path d="M347,246.8 H357 Q363,246.8 363,240.8 V157.3 Q363,151.3 357,151.3 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="347" cy="246.8" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M347.5,151.3 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-edge="e-gate-reject"><path d="M347,336.3 H370 Q376,336.3 376,330.3 V169.3 Q376,163.3 370,163.3 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="347" cy="336.3" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M347.5,163.3 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-node="builder"><rect data-card="" x="12" y="127.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="142.1" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="145.5" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="142.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="165" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Builder</text><text x="22" y="178" font-size="10.5" style="fill:var(--gp-ink-2)">builder · strong · high</text></g><g data-node="critic"><rect data-card="" x="12" y="217" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="231.6" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="235" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="231.6" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="254.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Critic</text><text x="22" y="267.5" font-size="10.5" style="fill:var(--gp-ink-2)">critic · strong · high</text></g><g data-node="merge-gate"><rect data-card="" x="12" y="306.5" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:var(--gp-surface);stroke:var(--gp-gate)"/><circle cx="25.5" cy="321.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="324.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Human gate</text><circle cx="333.5" cy="321.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="344" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Merge approval</text><text x="22" y="357" font-size="10.5" style="fill:var(--gp-ink-2)">approve / reject with feedback</text></g><g data-node="done"><rect data-card="" x="12" y="396" width="335" height="59.5" rx="16" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="410.6" r="3.5" style="fill:var(--gp-stop)"/><text x="33" y="414" font-size="9.5" font-weight="700" style="fill:var(--gp-stop)">Stop</text><text x="22" y="433.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Done</text><text x="22" y="446.5" font-size="10.5" style="fill:var(--gp-ink-2)">success</text></g><rect x="161.8" y="284.4" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="294.7" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><rect x="161.8" y="373.9" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="384.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><g transform="rotate(-90 363 199)"><rect x="350.3" y="192.5" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-0)"/><text x="363" y="202.2" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-0)">fail</text></g><g transform="rotate(-90 376 249.8)"><rect x="363.3" y="243.3" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-0)"/><text x="376" y="253" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-0)">fail</text></g><text x="12" y="484.5" font-size="12.5" font-weight="700" style="fill:var(--gp-ink)">Loop</text><g data-loop="review-cycle"><circle cx="17" cy="501.5" r="4.5" style="fill:var(--gp-loop-0)"/><text x="28" y="505.5" font-size="12" font-weight="700" style="fill:var(--gp-ink)">Build-review cycle</text><text x="28" y="519" font-size="11" style="fill:var(--gp-ink-3)">judgment loop · Builder, Critic, Merge approval</text><text x="28" y="532.5" font-size="11" style="fill:var(--gp-ink-2)">Bar: Review checklist. Every checklist item is cited as satisfied</text><text x="28" y="546" font-size="11" style="fill:var(--gp-ink-2)">with a file and line, and the test command exits 0.</text><text x="28" y="559.5" font-size="11" style="fill:var(--gp-ink-2)">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="573" font-size="11" style="fill:var(--gp-ink-2)">2. max iterations: 4: halt the run and report to the human</text><text x="28" y="586.5" font-size="11" style="fill:var(--gp-ink-2)">3. budget: 40 turns: halt the run and report to the human</text></g></svg>
