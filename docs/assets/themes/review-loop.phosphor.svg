"231.6" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="254.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Critic</text><text x="22" y="267.5" font-size="10.5" style="fill:var(--gp-ink-2)">critic · strong · high</text></g><g data-node="merge-gate"><rect data-card="" x="12" y="306.5" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:var(--gp-surface);stroke:var(--gp-gate)"/><circle cx="25.5" cy="321.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="324.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Human gate</text><circle cx="333.5" cy="321.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="344" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Merge approval</text><text x="22" y="357" font-size="10.5" style="fill:var(--gp-ink-2)">approve / reject with feedback</text></g><g data-node="done"><rect data-card="" x="12" y="396" width="335" height="59.5" rx="16" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="410.6" r="3.5" style="fill:var(--gp-stop)"/><text x="33" y="414" font-size="9.5" font-weight="700" style="fill:var(--gp-stop)">Stop</text><text x="22" y="433.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Done</text><text x="22" y="446.5" font-size="10.5" style="fill:var(--gp-ink-2)">success</text></g><rect x="161.8" y="284.4" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="294.7" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><rect x="161.8" y="373.9" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="384.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><g transform="rotate(-90 363 199)"><rect x="350.3" y="192.5" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var