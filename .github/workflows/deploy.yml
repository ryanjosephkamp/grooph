name: Deploy web app

# Publishes apps/web to GitHub Pages at https://ryanjosephkamp.github.io/grooph/
# from main, with the pattern library beside it at /grooph/patterns/ so
# `grooph template add <id>` works without a clone (docs/templates.md §3).
# Pages must be set to "GitHub Actions" as its source (Settings → Pages), once.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @grooph/web test
      # The build bakes in the base path /grooph/ (apps/web/vite.config.ts).
      - run: pnpm --filter @grooph/web build

      # Never publish a stale index: it is what remote registries read.
      - name: publish the pattern library beside the app
        run: |
          pnpm --filter @grooph/core build
          node scripts/patterns-index.mjs --check
          cp -R patterns apps/web/dist/patterns

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
