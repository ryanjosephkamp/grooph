<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" viewBox="0 0 400 1102" width="400" height="1102" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Literature review, by hand with AI help</title><style>.grooph-picture{--gp-bg:#f1f4f3;--gp-surface:#fdfefe;--gp-surface-2:#e8edeb;--gp-ink:#1a201e;--gp-ink-2:#454c49;--gp-ink-3:#5f6764;--gp-line:#dce1df;--gp-line-strong:#b9c1be;--gp-accent:#1f5f4a;--gp-accent-soft:#dcefe6;--gp-gate:#b25e09;--gp-gate-soft:#fcf0d9;--gp-check:#2b5f9e;--gp-merge:#6b4fa0;--gp-stop:#5b5f66;--gp-ok:#1f7a4d;--gp-ok-soft:#dff3e6;--gp-warning:#955500;--gp-error:#b42318;--gp-error-soft:#fceae7;--gp-loop-0:#7a4cc2;--gp-loop-1:#0f7c8c;--gp-loop-2:#c2410c;--gp-loop-3:#b5306e}@media (prefers-color-scheme:dark){.grooph-picture:not([data-theme="light"]){--gp-bg:#111514;--gp-surface:#1b201e;--gp-surface-2:#242a27;--gp-ink:#ebefed;--gp-ink-2:#c0c7c4;--gp-ink-3:#99a19e;--gp-line:#2d3331;--gp-line-strong:#4a524f;--gp-accent:#5dbb94;--gp-accent-soft:#1e3a30;--gp-gate:#eb9a45;--gp-gate-soft:#362a15;--gp-check:#6fa3e0;--gp-merge:#a88be0;--gp-stop:#9ba0a8;--gp-ok:#6fcf9d;--gp-ok-soft:#1c3a2a;--gp-warning:#f0b35a;--gp-error:#ff8f80;--gp-error-soft:#3a1e1b;--gp-loop-0:#a883f0;--gp-loop-1:#3cc0d0;--gp-loop-2:#f0874f;--gp-loop-3:#ee6fa6}}.grooph-picture[data-theme="dark"]{--gp-bg:#111514;--gp-surface:#1b201e;--gp-surface-2:#242a27;--gp-ink:#ebefed;--gp-ink-2:#c0c7c4;--gp-ink-3:#99a19e;--gp-line:#2d3331;--gp-line-strong:#4a524f;--gp-accent:#5dbb94;--gp-accent-soft:#1e3a30;--gp-gate:#eb9a45;--gp-gate-soft:#362a15;--gp-check:#6fa3e0;--gp-merge:#a88be0;--gp-stop:#9ba0a8;--gp-ok:#6fcf9d;--gp-ok-soft:#1c3a2a;--gp-warning:#f0b35a;--gp-error:#ff8f80;--gp-error-soft:#3a1e1b;--gp-loop-0:#a883f0;--gp-loop-1:#3cc0d0;--gp-loop-2:#f0874f;--gp-loop-3:#ee6fa6}</style><rect x="0" y="0" width="400" height="1102" style="fill:var(--gp-bg)"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:var(--gp-ink)">Literature review, by hand with AI</text><text x="12" y="56" font-size="17" font-weight="700" style="fill:var(--gp-ink)">help</text><text x="12" y="73" font-size="11" style="fill:var(--gp-ink-3)">3 people's steps · 2 agents' steps · 2 gates · 2 loops · up to 6</text><text x="12" y="86" font-size="11" style="fill:var(--gp-ink-3)">rounds</text><text x="12" y="105.5" font-size="11.5" style="fill:var(--gp-ink-2)">Does spaced practice help adults remember new vocabulary</text><text x="12" y="120" font-size="11.5" style="fill:var(--gp-ink-2)">for longer? Done when REVIEW.md answers it from what is</text><text x="12" y="134.5" font-size="11.5" style="fill:var(--gp-ink-2)">published, with a source for every claim.</text><g data-edge="e-frame-find"><path d="M179.5,208 V232.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,237.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-find-choose"><path d="M179.5,297.5 V322" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,327 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-choose-read"><path d="M179.5,387 V411.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,416.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-read-skeptic"><path d="M179.5,476.5 V501" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,506 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-skeptic-pass"><path d="M179.5,566 V590.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,595.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-decide-write"><path d="M179.5,655.5 V680" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,685 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-write-done"><path d="M179.5,745 V769.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,774.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-choose-again"><path d="M347,357.3 H357 Q363,357.3 363,351.3 V273.8 Q363,267.8 357,267.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="347" cy="357.3" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M347.5,267.8 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-edge="e-skeptic-fail"><path d="M347,536.3 H357 Q363,536.3 363,530.3 V446.8 Q363,440.8 357,440.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-1)"/><circle cx="347" cy="536.3" r="2.2" style="fill:var(--gp-loop-1)"/><path d="M347.5,440.8 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-1)"/></g><g data-edge="e-decide-more"><path d="M347,625.8 H370 Q376,625.8 376,619.8 V458.8 Q376,452.8 370,452.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-1)"/><circle cx="347" cy="625.8" r="2.2" style="fill:var(--gp-loop-1)"/><path d="M347.5,452.8 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-1)"/></g><g data-node="frame"><rect data-card="" x="12" y="148.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="163.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="166.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Person</text><text x="22" y="186" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Frame the question</text><text x="22" y="199" font-size="10.5" style="fill:var(--gp-ink-2)">planner</text></g><g data-node="find"><rect data-card="" x="12" y="238" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="252.6" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="256" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="252.6" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="275.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Find candidate papers</text><text x="22" y="288.5" font-size="10.5" style="fill:var(--gp-ink-2)">researcher</text></g><g data-node="choose"><rect data-card="" x="12" y="327.5" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:var(--gp-surface);stroke:var(--gp-gate)"/><circle cx="25.5" cy="342.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="345.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Human gate</text><circle cx="333.5" cy="342.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="365" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Choose what to read</text><text x="22" y="378" font-size="10.5" style="fill:var(--gp-ink-2)">read these / search again</text></g><g data-node="read"><rect data-card="" x="12" y="417" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="431.6" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="435" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Person</text><circle cx="333.5" cy="431.6" r="3.5" style="fill:var(--gp-loop-1)"/><text x="22" y="454.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Read and take notes</text><text x="22" y="467.5" font-size="10.5" style="fill:var(--gp-ink-2)">researcher</text></g><g data-node="skeptic"><rect data-card="" x="12" y="506.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="521.1" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="524.5" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="521.1" r="3.5" style="fill:var(--gp-loop-1)"/><text x="22" y="544" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">A skeptic reads your notes</text><text x="22" y="557" font-size="10.5" style="fill:var(--gp-ink-2)">critic</text></g><g data-node="decide"><rect data-card="" x="12" y="596" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:var(--gp-surface);stroke:var(--gp-gate)"/><circle cx="25.5" cy="610.6" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="614" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Human gate</text><circle cx="333.5" cy="610.6" r="3.5" style="fill:var(--gp-loop-1)"/><text x="22" y="633.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Decide what is in</text><text x="22" y="646.5" font-size="10.5" style="fill:var(--gp-ink-2)">write it up / read more</text></g><g data-node="write"><rect data-card="" x="12" y="685.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="700.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="703.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Person</text><text x="22" y="723" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Write the review</text><text x="22" y="736" font-size="10.5" style="fill:var(--gp-ink-2)">synthesizer</text></g><g data-node="done"><rect data-card="" x="12" y="775" width="335" height="59.5" rx="16" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="789.6" r="3.5" style="fill:var(--gp-stop)"/><text x="33" y="793" font-size="9.5" font-weight="700" style="fill:var(--gp-stop)">Stop</text><text x="22" y="812.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Done</text><text x="22" y="825.5" font-size="10.5" style="fill:var(--gp-ink-2)">success</text></g><rect x="161.8" y="394.9" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="405.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><rect x="161.8" y="573.9" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="584.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><rect x="161.8" y="663.4" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="673.7" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><g transform="rotate(-90 363 312.5)"><rect x="350.3" y="306" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-0)"/><text x="363" y="315.7" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-0)">fail</text></g><g transform="rotate(-90 363 488.5)"><rect x="350.3" y="482" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-1)"/><text x="363" y="491.7" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-1)">fail</text></g><g transform="rotate(-90 376 539.3)"><rect x="363.3" y="532.8" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-1)"/><text x="376" y="542.5" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-1)">fail</text></g><text x="12" y="863.5" font-size="12.5" font-weight="700" style="fill:var(--gp-ink)">Loops</text><g data-loop="search"><circle cx="17" cy="880.5" r="4.5" style="fill:var(--gp-loop-0)"/><text x="28" y="884.5" font-size="12" font-weight="700" style="fill:var(--gp-ink)">Search</text><text x="28" y="898" font-size="11" style="fill:var(--gp-ink-3)">judgment loop · Find candidate papers, Choose what to read</text><text x="28" y="911.5" font-size="11" style="fill:var(--gp-ink-2)">Bar: A reading list that covers the question. Every part of</text><text x="28" y="925" font-size="11" style="fill:var(--gp-ink-2)">QUESTION.md has a candidate paper in CANDIDATES.md, or</text><text x="28" y="938.5" font-size="11" style="fill:var(--gp-ink-2)">is listed there as having none.</text><text x="28" y="952" font-size="11" style="fill:var(--gp-ink-2)">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="965.5" font-size="11" style="fill:var(--gp-ink-2)">2. max iterations: 3: stop here and decide</text></g><g data-loop="notes"><circle cx="17" cy="985.5" r="4.5" style="fill:var(--gp-loop-1)"/><text x="28" y="989.5" font-size="12" font-weight="700" style="fill:var(--gp-ink)">Notes</text><text x="28" y="1003" font-size="11" style="fill:var(--gp-ink-3)">judgment loop · Read and take notes, A skeptic reads your</text><text x="28" y="1016.5" font-size="11" style="fill:var(--gp-ink-3)">notes, Decide what is in</text><text x="28" y="1030" font-size="11" style="fill:var(--gp-ink-2)">Bar: Notes that stand up. Every claim the notes lean on</text><text x="28" y="1043.5" font-size="11" style="fill:var(--gp-ink-2)">names its paper and page, and every disagreement between</text><text x="28" y="1057" font-size="11" style="fill:var(--gp-ink-2)">papers is written down.</text><text x="28" y="1070.5" font-size="11" style="fill:var(--gp-ink-2)">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="1084" font-size="11" style="fill:var(--gp-ink-2)">2. max iterations: 3: stop here and decide</text></g></svg>
