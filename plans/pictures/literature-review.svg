<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" viewBox="0 0 400 1089" width="400" height="1089" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Literature review, by hand with AI help</title><style>.grooph-picture{--gp-bg:#f1f4f3;--gp-surface:#fdfefe;--gp-surface-2:#e8edeb;--gp-ink:#1a201e;--gp-ink-2:#454c49;--gp-ink-3:#5f6764;--gp-line:#dce1df;--gp-line-strong:#b9c1be;--gp-accent:#1f5f4a;--gp-accent-soft:#dcefe6;--gp-gate:#b25e09;--gp-gate-soft:#fcf0d9;--gp-check:#2b5f9e;--gp-merge:#6b4fa0;--gp-stop:#5b5f66;--gp-ok:#1f7a4d;--gp-ok-soft:#dff3e6;--gp-warning:#955500;--gp-error:#b42318;--gp-error-soft:#fceae7;--gp-loop-0:#7a4cc2;--gp-loop-1:#0f7c8c;--gp-loop-2:#c2410c;--gp-loop-3:#b5306e}@media (prefers-color-scheme:dark){.grooph-picture:not([data-theme="light"]){--gp-bg:#111514;--gp-surface:#1b201e;--gp-surface-2:#242a27;--gp-ink:#ebefed;--gp-ink-2:#c0c7c4;--gp-ink-3:#99a19e;--gp-line:#2d3331;--gp-line-strong:#4a524f;--gp-accent:#5dbb94;--gp-accent-soft:#1e3a30;--gp-gate:#eb9a45;--gp-gate-soft:#362a15;--gp-check:#6fa3e0;--gp-merge:#a88be0;--gp-stop:#9ba0a8;--gp-ok:#6fcf9d;--gp-ok-soft:#1c3a2a;--gp-warning:#f0b35a;--gp-error:#ff8f80;--gp-error-soft:#3a1e1b;--gp-loop-0:#a883f0;--gp-loop-1:#3cc0d0;--gp-loop-2:#f0874f;--gp-loop-3:#ee6fa6}}.grooph-picture[data-theme="dark"]{--gp-bg:#111514;--gp-surface:#1b201e;--gp-surface-2:#242a27;--gp-ink:#ebefed;--gp-ink-2:#c0c7c4;--gp-ink-3:#99a19e;--gp-line:#2d3331;--gp-line-strong:#4a524f;--gp-accent:#5dbb94;--gp-accent-soft:#1e3a30;--gp-gate:#eb9a45;--gp-gate-soft:#362a15;--gp-check:#6fa3e0;--gp-merge:#a88be0;--gp-stop:#9ba0a8;--gp-ok:#6fcf9d;--gp-ok-soft:#1c3a2a;--gp-warning:#f0b35a;--gp-error:#ff8f80;--gp-error-soft:#3a1e1b;--gp-loop-0:#a883f0;--gp-loop-1:#3cc0d0;--gp-loop-2:#f0874f;--gp-loop-3:#ee6fa6}</style><rect x="0" y="0" width="400" height="1089" style="fill:var(--gp-bg)"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:var(--gp-ink)">Literature review, by hand with AI</text><text x="12" y="56" font-size="17" font-weight="700" style="fill:var(--gp-ink)">help</text><text x="12" y="73" font-size="11" style="fill:var(--gp-ink-3)">5 agents · 2 gates · 2 loops · up to 6 rounds</text><text x="12" y="92.5" font-size="11.5" style="fill:var(--gp-ink-2)">Does spaced practice help adults remember new vocabulary</text><text x="12" y="107" font-size="11.5" style="fill:var(--gp-ink-2)">for longer? Done when REVIEW.md answers it from what is</text><text x="12" y="121.5" font-size="11.5" style="fill:var(--gp-ink-2)">published, with a source for every claim.</text><g data-edge="e-frame-find"><path d="M179.5,195 V219.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,224.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-find-choose"><path d="M179.5,284.5 V309" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,314 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-choose-read"><path d="M179.5,374 V398.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,403.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-read-skeptic"><path d="M179.5,463.5 V488" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,493 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-skeptic-pass"><path d="M179.5,553 V577.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,582.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-decide-write"><path d="M179.5,642.5 V667" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,672 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-write-done"><path d="M179.5,732 V756.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,761.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-choose-again"><path d="M347,344.3 H357 Q363,344.3 363,338.3 V260.8 Q363,254.8 357,254.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="347" cy="344.3" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M347.5,254.8 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-edge="e-skeptic-fail"><path d="M347,523.3 H357 Q363,523.3 363,517.3 V433.8 Q363,427.8 357,427.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-1)"/><circle cx="347" cy="523.3" r="2.2" style="fill:var(--gp-loop-1)"/><path d="M347.5,427.8 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-1)"/></g><g data-edge="e-decide-more"><path d="M347,612.8 H370 Q376,612.8 376,606.8 V445.8 Q376,439.8 370,439.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-1)"/><circle cx="347" cy="612.8" r="2.2" style="fill:var(--gp-loop-1)"/><path d="M347.5,439.8 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-1)"/></g><g data-node="frame"><rect data-card="" x="12" y="135.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="150.1" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="153.5" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><text x="22" y="173" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Frame the question</text><text x="22" y="186" font-size="10.5" style="fill:var(--gp-ink-2)">planner</text></g><g data-node="find"><rect data-card="" x="12" y="225" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="239.6" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="243" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="239.6" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="262.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Find candidate papers</text><text x="22" y="275.5" font-size="10.5" style="fill:var(--gp-ink-2)">researcher</text></g><g data-node="choose"><rect data-card="" x="12" y="314.5" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:var(--gp-surface);stroke:var(--gp-gate)"/><circle cx="25.5" cy="329.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="332.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Human gate</text><circle cx="333.5" cy="329.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="352" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Choose what to read</text><text x="22" y="365" font-size="10.5" style="fill:var(--gp-ink-2)">read these / search again</text></g><g data-node="read"><rect data-card="" x="12" y="404" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="418.6" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="422" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="418.6" r="3.5" style="fill:var(--gp-loop-1)"/><text x="22" y="441.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Read and take notes</text><text x="22" y="454.5" font-size="10.5" style="fill:var(--gp-ink-2)">researcher</text></g><g data-node="skeptic"><rect data-card="" x="12" y="493.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="508.1" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="511.5" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="508.1" r="3.5" style="fill:v