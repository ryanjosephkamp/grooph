)"/><text x="179.5" y="392.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><rect x="161.8" y="560.9" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="571.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><rect x="161.8" y="650.4" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="660.7" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><g transform="rotate(-90 363 299.5)"><rect x="350.3" y="293" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-0)"/><text x="363" y="302.7" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-0)">fail</text></g><g transform="rotate(-90 363 475.5)"><rect x="350.3" y="469" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-1)"/><text x="363" y="478.7" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-1)">fail</text></g><g transform="rotate(-90 376 526.3)"><rect x="363.3" y="519.8" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-1)"/><text x="376" y="529.5" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-1)">fail</text></g><text x="12" y="850.5" font-size="12.5" font-weight="700" style="fill:var(--gp-ink)">Loops</text><g data-loop="search"><circle cx="17" cy="867.5" r="4.5" style="fill:var(--gp-loop-0)"/><text x="28" y="871.5" font-size="12" font-weight="700" style="fill:var(--gp-ink)">Search</text><text x="28" y="885" font-size="11" style="fill:var(--gp-ink-3)">judgment loop · Find candidate papers, Choose what to read</text><text x="28" y="898.5" font-size="11" style="fill:var(--gp-ink-2)">Bar: A reading list that covers the question. Every part of</text><text x="28" y="912" font-size="11" style="fill:var(--gp-ink-2)">QUESTION.md has a candidate paper in CANDIDATES.md, or</text><text x="28" y="925.5" font-size="11" style="fill:var(--gp-ink-2)">is listed there as having none.</text><text x="28" y="939" font-size="11" style="fill:var(--gp-ink-2)">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="952.5" font-size="11" style="fill:var(--gp-ink-2)">2. max iterations: 3: halt the run and report to the human</text></g><g data-loop="notes"><circle cx="17" cy="972.5" r="4.5" style="fill:var(--gp-loop-1)"/><text x="28" y="976.5" font-size="12" font-weight="700" style="fill:var(--gp-ink)">Notes</text><text x="28" y="990" font-size="11" style="fill:var(--gp-ink-3)">judgment loop · Read and take notes, A skeptic reads your</text><text x="28" y="1003.5" font-size="11" style="fill:var(--gp-ink-3)">notes, Decide what is in</text><text x="28" y="1017" font-size="11" style="fill:var(--gp-ink-2)">Bar: Notes that stand up. Every claim the notes lean on</text><text x="28" y="1030.5" font-size="11" style="fill:var(--gp-ink-2)">names its paper and page, and every disagreement between</text><text x="28" y="1044" font-size="11" style="fill:var(--gp-ink-2)">papers is written down.</text><text x="28" y="1057.5" font-size="11" style="fill:var(--gp-ink-2)">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="1071" font-size="11" style="fill:var(--gp-ink-2)">2. max iterations: 3: halt the run and report to the human</text></g></svg>
