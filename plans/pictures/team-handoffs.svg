<svg xmlns="http://www.w3.org/2000/svg" class="grooph-picture" data-picture="graph" viewBox="0 0 400 694.5" width="400" height="694.5" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title>Team handoffs</title><style>.grooph-picture{--gp-bg:#f1f4f3;--gp-surface:#fdfefe;--gp-surface-2:#e8edeb;--gp-ink:#1a201e;--gp-ink-2:#454c49;--gp-ink-3:#5f6764;--gp-line:#dce1df;--gp-line-strong:#b9c1be;--gp-accent:#1f5f4a;--gp-accent-soft:#dcefe6;--gp-gate:#b25e09;--gp-gate-soft:#fcf0d9;--gp-check:#2b5f9e;--gp-merge:#6b4fa0;--gp-stop:#5b5f66;--gp-ok:#1f7a4d;--gp-ok-soft:#dff3e6;--gp-warning:#955500;--gp-error:#b42318;--gp-error-soft:#fceae7;--gp-loop-0:#7a4cc2;--gp-loop-1:#0f7c8c;--gp-loop-2:#c2410c;--gp-loop-3:#b5306e}@media (prefers-color-scheme:dark){.grooph-picture:not([data-theme="light"]){--gp-bg:#111514;--gp-surface:#1b201e;--gp-surface-2:#242a27;--gp-ink:#ebefed;--gp-ink-2:#c0c7c4;--gp-ink-3:#99a19e;--gp-line:#2d3331;--gp-line-strong:#4a524f;--gp-accent:#5dbb94;--gp-accent-soft:#1e3a30;--gp-gate:#eb9a45;--gp-gate-soft:#362a15;--gp-check:#6fa3e0;--gp-merge:#a88be0;--gp-stop:#9ba0a8;--gp-ok:#6fcf9d;--gp-ok-soft:#1c3a2a;--gp-warning:#f0b35a;--gp-error:#ff8f80;--gp-error-soft:#3a1e1b;--gp-loop-0:#a883f0;--gp-loop-1:#3cc0d0;--gp-loop-2:#f0874f;--gp-loop-3:#ee6fa6}}.grooph-picture[data-theme="dark"]{--gp-bg:#111514;--gp-surface:#1b201e;--gp-surface-2:#242a27;--gp-ink:#ebefed;--gp-ink-2:#c0c7c4;--gp-ink-3:#99a19e;--gp-line:#2d3331;--gp-line-strong:#4a524f;--gp-accent:#5dbb94;--gp-accent-soft:#1e3a30;--gp-gate:#eb9a45;--gp-gate-soft:#362a15;--gp-check:#6fa3e0;--gp-merge:#a88be0;--gp-stop:#9ba0a8;--gp-ok:#6fcf9d;--gp-ok-soft:#1c3a2a;--gp-warning:#f0b35a;--gp-error:#ff8f80;--gp-error-soft:#3a1e1b;--gp-loop-0:#a883f0;--gp-loop-1:#3cc0d0;--gp-loop-2:#f0874f;--gp-loop-3:#ee6fa6}</style><rect x="0" y="0" width="400" height="694.5" style="fill:var(--gp-bg)"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:var(--gp-ink)">Team handoffs</text><text x="12" y="52" font-size="11" style="fill:var(--gp-ink-3)">3 people's steps · 1 gate · 1 loop · up to 3 rounds</text><text x="12" y="71.5" font-size="11.5" style="fill:var(--gp-ink-2)">The spring newsletter, written, laid out and ready to send.</text><text x="12" y="86" font-size="11.5" style="fill:var(--gp-ink-2)">Done when Noor has passed it against the request and Priya</text><text x="12" y="100.5" font-size="11.5" style="fill:var(--gp-ink-2)">has signed off.</text><g data-edge="e-request-do"><path d="M179.5,174 V198.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,203.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-do-review"><path d="M179.5,263.5 V288" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,293 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-review-pass"><path d="M179.5,353 V377.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,382.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-sign-off-done"><path d="M179.5,442.5 V467" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,472 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-review-fail"><path d="M347,323.3 H357 Q363,323.3 363,317.3 V233.8 Q363,227.8 357,227.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="347" cy="323.3" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M347.5,227.8 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-edge="e-sign-off-back"><path d="M347,412.8 H370 Q376,412.8 376,406.8 V245.8 Q376,239.8 370,239.8 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="347" cy="412.8" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M347.5,239.8 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-node="request"><rect data-card="" x="12" y="114.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="129.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="132.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Person</text><text x="22" y="152" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Priya writes the request</text><text x="22" y="165" font-size="10.5" style="fill:var(--gp-ink-2)">planner</text></g><g data-node="do"><rect data-card="" x="12" y="204" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="218.6" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="222" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Person</text><circle cx="333.5" cy="218.6" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="241.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Sam does the work</text><text x="22" y="254.5" font-size="10.5" style="fill:var(--gp-ink-2)">builder</text></g><g data-node="review"><rect data-card="" x="12" y="293.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="308.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="311.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Person</text><circle cx="333.5" cy="308.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="331" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Noor reviews</text><text x="22" y="344" font-size="10.5" style="fill:var(--gp-ink-2)">critic</text></g><g data-node="sign-off"><rect data-card="" x="12" y="383" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:var(--gp-surface);stroke:var(--gp-gate)"/><circle cx="25.5" cy="397.6" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="401" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Human gate</text><circle cx="333.5" cy="397.6" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="420.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Priya signs off</text><text x="22" y="433.5" font-size="10.5" style="fill:var(--gp-ink-2)">sign off / send it back</text></g><g data-node="done"><rect data-card="" x="12" y="472.5" width="335" height="59.5" rx="16" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="487.1" r="3.5" style="fill:var(--gp-stop)"/><text x="33" y="490.5" font-size="9.5" font-weight="700" style="fill:var(--gp-stop)">Stop</text><text x="22" y="510" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Handed over</text><text x="22" y="523" font-size="10.5" style="fill:var(--gp-ink-2)">success</text></g><rect x="161.8" y="360.9" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="371.2" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><rect x="161.8" y="450.4" width="35.4" height="14.7" rx="7.4" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-ink-2)"/><text x="179.5" y="460.7" font-size="9.5" font-weight="700" text-anchor="middle" style="fill:var(--gp-ink-2)">pass</text><g transform="rotate(-90 363 275.5)"><rect x="350.3" y="269" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-0)"/><text x="363" y="278.7" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-0)">fail</text></g><g transform="rotate(-90 376 326.3)"><rect x="363.3" y="319.8" width="25.4" height="13" rx="6.5" stroke-width="1" style="fill:var(--gp-bg);stroke:var(--gp-loop-0)"/><text x="376" y="329.5" font-size="9" font-weight="700" text-anchor="middle" style="fill:var(--gp-loop-0)">fail</text></g><text x="12" y="561" font-size="12.5" font-weight="700" style="fill:var(--gp-ink)">Loop</text><g data-loop="review-loop"><circle cx="17" cy="578" r="4.5" style="fill:var(--gp-loop-0)"/><text x="28" y="582" font-size="12" font-weight="700" style="fill:var(--gp-ink)">Review</text><text x="28" y="595.5" font-size="11" style="fill:var(--gp-ink-3)">judgment loop · Sam does the work, Noor reviews, Priya signs</text><text x="28" y="609" font-size="11" style="fill:var(--gp-ink-3)">off</text><text x="28" y="622.5" font-size="11" style="fill:var(--gp-ink-2)">Bar: The request. Everything REQUEST.md asks for is there,</text><text x="28" y="636" font-size="11" style="fill:var(--gp-ink-2)">or is named in HANDOFF.md as left out for a reason the</text><text x="28" y="649.5" font-size="11" style="fill:var(--gp-ink-2)">reviewer accepts.</text><text x="28" y="663" font-size="11" style="fill:var(--gp-ink-2)">1. bar passed: follow the loop's pass exit edges</text><text x="28" y="676.5" font-size="11" style="fill:var(--gp-ink-2)">2. max iterations: 3: stop here and decide</text></g></svg>
