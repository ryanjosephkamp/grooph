re[data-look="transit"]{font-family:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.grooph-picture[data-look="transit"] [data-edge] [style="stroke:var(--gp-ink-2)"]{stroke:var(--gp-route)!important}.grooph-picture[data-look="transit"] [data-edge] [style="fill:var(--gp-ink-2)"]{fill:var(--gp-route)!important}.grooph-picture[data-look="transit"] [data-edge] path[fill="none"]{stroke-width:4.5}.grooph-picture[data-look="transit"] [data-edge] path[stroke-dasharray="5 3"]{stroke-dasharray:10 5;stroke-linecap:butt}.grooph-picture[data-look="transit"] [data-edge] path[stroke-dasharray="1.5 3"]{stroke-dasharray:.1 8}.grooph-picture[data-look="transit"] [data-edge] path+path,.grooph-picture[data-look="transit"] [data-edge] circle+path{transform-box:fill-box;transform-origin:center;transform:scale(1.6)}.grooph-picture[data-look="transit"] [data-edge] circle{r:4.2px;stroke:var(--gp-bg);stroke-width:1.5}.grooph-picture[data-look="transit"] rect[data-card]{stroke-width:2.6}.grooph-picture[data-look="transit"] rect[data-card][stroke-width="1.8"]{stroke-width:4.2}.grooph-picture[data-look="transit"] rect[data-card][stroke-width="1.4"]{stroke-width:3.4}.grooph-picture[data-look="transit"] [data-node] rect[data-card],.grooph-picture[data-look="transit"] [data-session] rect{rx:22px;ry:22px}.grooph-picture[data-look="transit"] rect[data-card][rx="16"]{rx:5px;ry:5px}.grooph-picture[data-look="transit"] [data-node] text[font-size="9.5"]{text-transform:uppercase;letter-spacing:.08em}</style><rect x="0" y="0" width="400" height="604.5" style="fill:var(--gp-bg)"/><text x="12" y="35" font-size="17" font-weight="700" style="fill:var(--gp-ink)">Review loop</text><text x="12" y="52" font-size="11" style="fill:var(--gp-ink-3)">claude-code · 2 agents · 1 gate · 1 loop · up to 4 rounds · 40</text><text x="12" y="65" font-size="11" style="fill:var(--gp-ink-3)">turns</text><text x="12" y="84.5" font-size="11.5" style="fill:var(--gp-ink-2)">Implement the change described in TASK.md so that every</text><text x="12" y="99" font-size="11.5" style="fill:var(--gp-ink-2)">item in the review checklist is satisfied and the test command</text><text x="12" y="113.5" font-size="11.5" style="fill:var(--gp-ink-2)">passes.</text><g data-edge="e-build-review"><path d="M179.5,187 V211.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,216.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-review-pass"><path d="M179.5,276.5 V301" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,306 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-gate-approve"><path d="M179.5,366 V390.5" fill="none" stroke-width="1.5" stroke-linecap="round" style="stroke:var(--gp-ink-2)"/><path d="M179.5,395.5 l-3.6,-6.5 h7.2 z" style="fill:var(--gp-ink-2)"/></g><g data-edge="e-review-fail"><path d="M347,246.8 H357 Q363,246.8 363,240.8 V157.3 Q363,151.3 357,151.3 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="347" cy="246.8" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M347.5,151.3 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-edge="e-gate-reject"><path d="M347,336.3 H370 Q376,336.3 376,330.3 V169.3 Q376,163.3 370,163.3 H352.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3" style="stroke:var(--gp-loop-0)"/><circle cx="347" cy="336.3" r="2.2" style="fill:var(--gp-loop-0)"/><path d="M347.5,163.3 l6.5,-3.6 v7.2 z" style="fill:var(--gp-loop-0)"/></g><g data-node="builder"><rect data-card="" x="12" y="127.5" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="142.1" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="145.5" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="142.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="165" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Builder</text><text x="22" y="178" font-size="10.5" style="fill:var(--gp-ink-2)">builder · strong · high</text></g><g data-node="critic"><rect data-card="" x="12" y="217" width="335" height="59.5" rx="9" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="231.6" r="3.5" style="fill:var(--gp-accent)"/><text x="33" y="235" font-size="9.5" font-weight="700" style="fill:var(--gp-accent)">Agent</text><circle cx="333.5" cy="231.6" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="254.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Critic</text><text x="22" y="267.5" font-size="10.5" style="fill:var(--gp-ink-2)">critic · strong · high</text></g><g data-node="merge-gate"><rect data-card="" x="12" y="306.5" width="335" height="59.5" rx="9" stroke-width="1.8" style="fill:var(--gp-surface);stroke:var(--gp-gate)"/><circle cx="25.5" cy="321.1" r="3.5" style="fill:var(--gp-gate)"/><text x="33" y="324.5" font-size="9.5" font-weight="700" style="fill:var(--gp-gate)">Human gate</text><circle cx="333.5" cy="321.1" r="3.5" style="fill:var(--gp-loop-0)"/><text x="22" y="344" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Merge approval</text><text x="22" y="357" font-size="10.5" style="fill:var(--gp-ink-2)">approve / reject with feedback</text></g><g data-node="done"><rect data-card="" x="12" y="396" width="335" height="59.5" rx="16" stroke-width="1" style="fill:var(--gp-surface);stroke:var(--gp-line-strong)"/><circle cx="25.5" cy="410.6" r="3.5" style="fill:var(--gp-stop)"/><text x="33" y="414" font-size="9.5" font-weight="700" style="fill:var(--gp-stop)">Stop</text><text x="22" y="433.5" font-size="13.5" font-weight="700" style="fill:var(--gp-ink)">Done</text><text x="22" y="446.5" font-size="10.5" style="fill:var(--gp-ink-2)">success</text></g><rect x="16