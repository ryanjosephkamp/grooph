    <!-- Named for the service worker, which keeps what this page names. The media never matches: the browser fetches a font when text first uses it. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin media="not all" href="/assets/fonts/atkinson-hyperlegible-next.v1.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin media="not all" href="/assets/fonts/atkinson-hyperlegible-next-italic.v1.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin media="not all" href="/assets/fonts/atkinson-hyperlegible-mono.v1.woff2" />
    <link rel="preload" as="image" media="not all" href="/assets/site-icons.v2.svg" />
    <!-- The looks after the first, linked below when one is kept. -->
    <link id="site-looks" rel="preload" as="style" media="not all" href="/assets/site-looks.v1.css" />
    <title>grooph: workflow diagrams in 2D and 3D</title>
    <!-- The look chosen in the header, before the first paint: ?theme= wins and is kept. Its stylesheet is written in
         single quotes: the worker keeps every double-quoted address here. An embed has its own colors. -->
    <script>
      (() => { if (/^#\/embed(\?|$)/.test(location.hash)) return; const ids = ["grooph", "meteor", "harbor", "plum", "ember", "graphite"]; let id = new URLSearchParams(location.search).get("theme"); try { if (ids.includes(id)) localStorage.setItem("groophTheme", id); else id = localStorage.getItem("groophTheme"); } catch {} if (ids.indexOf(id) > 0) { document.documentElement.dataset.theme = id; document.write('<link rel=stylesheet data-site-looks href=' + document.getElementById("site-looks").href + '>'); } })();
    </script>
  </head>

    <div id="root"></div>
